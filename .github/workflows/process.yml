name: process

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "17 5 * * *" # daily sweep (05:17 UTC)
  workflow_dispatch:
    inputs:
      url:
        description: "Optional Instagram URL to process directly"
        required: false
        default: ""
      model:
        description: "Optional Gemini model for this run only (default: repo variable GEMINI_MODEL, then config.toml)"
        required: false
        default: ""

# Read-only by default; each job asks for only what it needs.
permissions:
  contents: read

# GitHub keeps only one pending run per group, so every run drains the whole queue.
concurrency:
  group: recipes
  cancel-in-progress: false

jobs:
  process:
    # Security: only the repo owner's issues; on "labeled" only the retry label re-queues.
    # The Shortcut creates issues with labels, which fires opened + labeled(queued);
    # ignoring labeled(queued) avoids a redundant second run.
    if: >-
      github.event_name != 'issues' || (
        github.event.issue.user.login == github.repository_owner &&
        github.event.issue.pull_request == null &&
        (github.event.action == 'opened' || github.event.label.name == 'retry')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushes recipes.json and labels / comments on / closes issues. No Pages access.
    permissions:
      contents: write
      issues: write
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (yt-dlp always latest)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -U yt-dlp

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process queue
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_COOKIES_B64: ${{ secrets.IG_COOKIES_B64 }}
          GITHUB_TOKEN: ${{ github.token }}
          # Model precedence: Run workflow input > repo variable GEMINI_MODEL > config.toml
          GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            python -m recipebot --url "$INPUT_URL" || echo "::warning::--url run failed; continuing with queue"
            first=$(grep -c '^published=true' "$GITHUB_OUTPUT" || true)
          fi
          python -m recipebot --all-queued
          if [ "${first:-0}" != "0" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: process
    # Also deploy when the process job failed after publishing (e.g. model became unavailable mid-run).
    if: >-
      !cancelled() && needs.process.result != 'skipped' &&
      (needs.process.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishes the site only. Cannot push to the repo or touch issues.
    # actions: read lets the wait step list this run's artifacts.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # A syntax error in index.html blanks the whole site, so never publish one.
      - name: Check site files
        run: node scripts/check-site.mjs index.html recipes.json

      - name: Build site artifact
        run: |
          mkdir -p _site
          cp index.html recipes.json _site/

      # Artifacts are shared by all attempts of a run, so a re-run would add a second
      # "github-pages" artifact and deploy-pages would refuse. Name it per attempt.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # The artifact list can lag behind the upload, which makes deploy-pages report
      # "No artifacts named ... were found". Wait until it is listed.
      - name: Wait for artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$NAME" --jq .total_count || true)
            if [ "${n:-0}" -ge 1 ]; then echo "Artifact $NAME is listed"; exit 0; fi
            echo "Artifact not listed yet ($i/12)"; sleep 5
          done
          echo "::warning::Artifact $NAME still not listed after 60s; deploying anyway"

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

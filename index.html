      "</div></section>" +
      '<section class="fgroup"><h3>Editing</h3><p class="set-note">' +
        (has ? "A GitHub token is saved on this device, so edits and re-reads can be sent. It is never part of a backup."
          : "No GitHub token on this device. You will be asked for one the first time you send an edit or a re-read.") + "</p>" +
        '<div class="set-btns">' + (has ? '<button class="btn ghost" type="button" data-act="tokForget">Forget token</button>'
          : '<button class="btn ghost" type="button" data-act="tokAdd">Add token</button>') + "</div></section>";
  }

  // Everything under the "rb." prefix: saved recipes, ticks, shopping list, recent, preferences.
  function exportData() {
    const data = {};
    store.keys().forEach((k) => { data[k] = store.get(k, null); });
    delete data[TOKEN_KEY]; // second safeguard: the token is outside the "rb." prefix and never listed
    const day = new Date().toISOString().slice(0, 10);
    const name = "recipes-backup-" + day + ".json";
    const payload = JSON.stringify({ app: "recipes", version: 1, exported: new Date().toISOString(), data }, null, 2);
    let file = null;
    try { file = new File([payload], name, { type: "application/json" }); } catch (_) {}
    // On phones the share sheet offers "Save to Files"; a plain download is unreliable from the Home Screen app.
    const touch = matchMedia("(pointer: coarse)").matches;
    if (file && touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(() => {});
      return;
    }
    const url = URL.createObjectURL(file || new Blob([payload], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Backup saved");
  }

  // Replaces this device's saved data with the backup, then reloads so every view starts clean.
  async function importData(file) {
    let obj = null;
    try { obj = JSON.parse(await file.text()); } catch (_) {}
    if (!obj || obj.app !== "recipes" || !obj.data || typeof obj.data !== "object" || Array.isArray(obj.data)) {
      toast("That file is not a recipes backup");
      return;
    }
    if (!confirm("Replace the saved recipes, ticks and shopping list on this device with this backup?")) return;
    store.keys().forEach((k) => store.remove(k));
    Object.keys(obj.data).forEach((k) => { if (/^[A-Za-z]+$/.test(k)) store.set(k, obj.data[k], true); });
    askPersist();
    location.reload();
  }

  /* ----- recipe page ----- */
  // Estimated amount at the start of an item: "~300 g", "~1/2 cup", "~4".
  const EST = /^~\s*([\d.,\/\u00bc-\u00be\u2150-\u215e-]+(?:\s*(?:kg|g|mg|ml|cl|dl|l|tbsp|tsp|cups?|tablespoons?|teaspoons?|oz|lbs?)\b)?)?/i;

  // Escapes an ingredient or step, greys out "~" estimates and highlights "TBD:" gaps.
  function fmtItem(s) {
    let h = esc(s);
    h = h.replace(/(TBD:[^,;.]*)/g, '<mark class="tbd">$1</mark>');
    h = h.replace(EST, (m, q) => '<span class="est" title="Estimated amount">~' + (q || "") + "</span>");
    return h;
  }

  function viewRecipe(id) {
    const r = byId.get(id);
    const bar = '<div class="backbar"><button class="back" type="button" data-act="back">' + icon("back") + "Back</button></div>";
    if (!r) {
      return bar + '<div class="state"><b>Recipe not found</b>It may have been removed or its link changed.' +
        '<br><a class="btn" href="#/">Go to Home</a></div>';
    }
    if (edit && edit.id === id) return viewEdit(r);
    const t = ticks.get(id);
    const tab = rtabs[id] || "ing";
    const nI = r.ingredients.length, nS = r.steps.length;
    const facts = [
      r._min != null ? [timeEst(r), "Time, about"] : null,
      [String(nI), nI === 1 ? "Ingredient" : "Ingredients"],
      [String(nS), nS === 1 ? "Step" : "Steps"],
    ].filter(Boolean);
    const ings = r.ingredients.map((s, i) => {
      const on = t.i.includes(i);
      return '<li><button class="ing' + (on ? " on" : "") + '" type="button" role="checkbox" aria-checked="' + on +
        '" data-act="tickIng" data-i="' + i + '"><span class="box" aria-hidden="true"></span><span class="txt">' + fmtItem(s) + "</span></button></li>";
    }).join("");
    const steps = r.steps.map((s, i) => {
      const on = t.s === i;
      return '<li><button class="step' + (on ? " on" : "") + '" type="button" aria-pressed="' + on + '" data-act="tickStep" data-i="' + i +
        '"><span class="num" aria-hidden="true">' + (i + 1) + '</span><span class="txt"><span class="sr">Step ' + (i + 1) + ": </span>" +
        fmtItem(s) + "</span></button></li>";
    }).join("");
    const igOk = /^https:\/\//i.test(r.url);
    return bar + '<article class="recipe">' + cover(r, "hero") +
      '<h1 class="r-title">' + esc(r.name) + "</h1>" +
      '<div class="sub">' + esc([r.cuisine, r.type].filter(Boolean).join(" \u00b7 ")) +
        (r.needs_review ? '<span class="tag-review">Review</span>' : "") + "</div>" +
      '<div class="facts">' + facts.map(([v, l]) => '<div class="fact"><b>' + esc(v) + "</b><span>" + l + "</span></div>").join("") + "</div>" +
      '<div class="r-actions">' +
        '<button class="act-btn" type="button" data-act="save" data-id="' + esc(r._id) + '" aria-pressed="' + saved.has(r._id) + '">' +
          icon("heart") + '<span class="when-off">Save</span><span class="when-on">Saved</span></button>' +
        '<button class="act-btn" type="button" data-act="share">' + icon("share") + "Share</button>" +
        (igOk ? '<a class="act-btn" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + icon("insta") + "Instagram</a>" : "") +
        '<button class="act-btn" type="button" data-act="editStart">' + icon("edit") + "Edit</button>" +
        (igOk ? '<button class="act-btn" type="button" data-act="reread">' + icon("reread") + "Re-read from video</button>" : "") +
        (wake.supported ? '<label class="wake"><span>Keep screen on</span><span class="switch">' +
          '<input type="checkbox" role="switch" id="wakeSw"' + (wake.on ? " checked" : "") + '><span class="track"></span></span></label>' : "") +
      "</div>" +
      pendingNote(r) +
      (r.needs_review ? '<div class="note-review">This recipe needs review: some amounts or steps may be missing. Gaps are marked TBD.</div>' : "") +
      '<div class="seg" role="tablist" aria-label="Recipe sections">' +
        '<button type="button" role="tab" data-act="rtab" data-t="ing" aria-selected="' + (tab === "ing") + '">Ingredients <small>' + nI + "</small></button>" +
        '<button type="button" role="tab" data-act="rtab" data-t="steps" aria-selected="' + (tab === "steps") + '">Steps <small>' + nS + "</small></button>" +
      "</div>" +
      '<div class="r-cols" data-tab="' + tab + '">' +
        '<section class="p-ing"><div class="panel-head"><h2>Ingredients</h2>' +
          '<button class="link-btn" id="resetTicks" type="button" data-act="resetTicks"' + (t.i.length ? "" : " hidden") + ">Untick all</button></div>" +
          '<ul class="ings">' + ings + "</ul>" +
          '<div class="add-row"><button class="btn ghost" type="button" data-act="addList" data-m="all">' + icon("plus") + "Add all to list</button>" +
          '<button class="btn ghost" id="addUnticked" type="button" data-act="addList" data-m="unticked"' +
            (untickedCount(r, t) > 0 && untickedCount(r, t) < nI ? "" : " hidden") + ">" + icon("plus") +
            'Add unticked (<span id="untickedN">' + untickedCount(r, t) + "</span>)</button></div></section>" +
        '<section class="p-steps"><div class="panel-head"><h2>Steps</h2></div><ol class="steps">' + steps + "</ol></section>" +
      "</div>" +
      (r.added ? '<p class="added">Added ' + esc(r.added) + "</p>" : "") +
      "</article>";
  }

  /* ================= editing from the site (sent as GitHub issues) ================= */
  // An edit or a re-read is sent as a GitHub issue with your own token; the bot checks and applies
  // it (README: Editing a recipe). The token has its own key outside the "rb." prefix, so Export
  // never includes it and Import never removes it. It is only ever sent to api.github.com.
  const TOKEN_KEY = "recipes-token";
  const REPO = (() => {
    const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return m && seg ? m[1] + "/" + seg : "CojocaruCristianV/recipes";
  })();
  const LIMIT = { item: 500, field: 120, items: 100 }; // the bot enforces the same limits
  const token = {
    get() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (_) { return ""; } },
    set(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch (_) {} },
    clear() { try { localStorage.removeItem(TOKEN_KEY); } catch (_) {} },
  };
  // Accepts the value with or without "Bearer " and stray spaces or quotes.
  const cleanToken = (v) => String(v || "").trim().replace(/^bearer\s+/i, "").replace(/^["']+|["']+$/g, "").trim();

  class GhError extends Error {
    constructor(status, msg) { super(msg); this.status = status; }
  }
  async function ghApi(method, path, body, tok) {
    let res;
    try {
      res = await fetch("https://api.github.com/repos/" + REPO + path, {
        method, cache: "no-store",
        headers: Object.assign({
          Authorization: "Bearer " + (tok || token.get()),
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
        }, body ? { "Content-Type": "application/json" } : {}),
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (_) {
      throw new GhError(0, "No connection to GitHub. Check your internet connection and try again.");
    }
    if (res.ok) return res.status === 204 ? null : res.json();
    let detail = "";
    try { detail = ((await res.json()) || {}).message || ""; } catch (_) {}
    const s = res.status;
    if (s === 401) throw new GhError(s, "GitHub did not accept the token (it expired, was revoked or was pasted wrong).");
    if (s === 403 || s === 404) {
      throw new GhError(s, "The token cannot create issues in " + REPO + ". It needs access to the recipes repository " +
        "with Issues set to Read and write." + (detail ? " (" + detail + ")" : ""));
    }
    if (s === 422) {
      throw new GhError(s, "GitHub refused the request" + (detail ? " (" + detail + ")" : "") +
        ". If the edit or reread labels are missing, run scripts/create-labels.ps1.");
    }
    throw new GhError(s, "GitHub error " + s + (detail ? ": " + detail : "") + ". Try again in a moment.");
  }

  // The editable part of a recipe, in the same shape the bot compares (edits.view in Python).
  const editView = (r) => ({
    name: r.name, cuisine: r.cuisine, type: r.type, time: r.time,
    ingredients: r.ingredients.slice(), steps: r.steps.slice(), needs_review: r.needs_review,
  });
  const tidy = (s) => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  const tidyList = (l) => l.map(tidy).filter(Boolean);
  const grow = (ta) => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };

  // The open edit: { id, base: editView at the start, d: the draft, focus: { sel, at } after a redraw }.
  // Kept in memory while you visit other pages, so coming back to the recipe continues the edit.
  let edit = null;
  let sending = false;

  function editResult() {
    const d = edit.d;
    return {
      name: tidy(d.name), cuisine: tidy(d.cuisine), type: tidy(d.type), time: tidy(d.time),
      ingredients: tidyList(d.ingredients), steps: tidyList(d.steps), reviewed: d.reviewed === true,
    };
  }
  function editDirty() {
    if (!edit) return false;
    const a = edit.base, b = editResult();
    return b.reviewed || ["name", "cuisine", "type", "time"].some((k) => a[k] !== b[k]) ||
      JSON.stringify(a.ingredients) !== JSON.stringify(b.ingredients) || JSON.stringify(a.steps) !== JSON.stringify(b.steps);
  }
  // Why Save is not possible yet, or "".
  function editProblem() {
    const b = editResult();
    if (!b.name) return "The recipe needs a name.";
    if (!b.ingredients.length) return "Add at least one ingredient.";
    if (!b.steps.length) return "Add at least one step.";
    if (b.ingredients.length > LIMIT.items || b.steps.length > LIMIT.items) {
      return "At most " + LIMIT.items + " ingredients and " + LIMIT.items + " steps.";
    }
    if (!editDirty()) return "No changes yet.";
    return "";
  }
  function syncEditBar() {
    const b = $("#edSave"), w = $("#edWhy");
    if (!b || !edit) return;
    const p = editProblem();
    b.disabled = !!p;
    if (w) w.textContent = p === "No changes yet." ? "" : p;
  }

  function viewEdit(r) {
    const d = edit.d;
    const stale = JSON.stringify(editView(r)) !== JSON.stringify(edit.base);
    const field = (k, label, extra) => '<label class="ed-field"><span>' + label + '</span><input class="ed-in" type="text" data-ef="' + k +
      '" value="' + esc(d[k]) + '" maxlength="' + LIMIT.field + '" autocomplete="off"' + (extra || "") + "></label>";
    const list = (key, label, one) => {
      const items = d[key];
      const btn = (act, i, extra, ic, what, off) => '<button class="ed-btn' + (act === "edDel" ? " del" : "") + '" type="button" data-act="' + act +
        '" data-l="' + key + '" data-i="' + i + '"' + extra + (off ? " disabled" : "") + ' aria-label="' + what + " " + one.toLowerCase() + " " + (i + 1) + '">' +
        icon(ic) + "</button>";
      const rows = items.map((s, i) =>
        '<li class="ed-row">' + (key === "steps" ? '<span class="num" aria-hidden="true">' + (i + 1) + "</span>" : "") +
        '<textarea class="ed-ta" rows="1" data-el="' + key + '" data-i="' + i + '" maxlength="' + LIMIT.item + '" aria-label="' +
          one + " " + (i + 1) + '">' + esc(s) + "</textarea>" +
        '<span class="ed-tools">' +
          btn("edMove", i, ' data-d="-1"', "up", "Move up", i === 0) +
          btn("edMove", i, ' data-d="1"', "down", "Move down", i === items.length - 1) +
          btn("edDel", i, "", "trash", "Delete", false) +
        "</span></li>").join("");
      return '<section class="ed-sec"><h2>' + label + " <small>" + items.length + "</small></h2>" +
        '<ol class="ed-list">' + rows + "</ol>" +
        '<button class="btn ghost ed-add" type="button" data-act="edAdd" data-l="' + key + '">' + icon("plus") + "Add " + one.toLowerCase() + "</button></section>";
    };
    const dl = (id, f) => '<datalist id="' + id + '">' + counts(f).map(([v]) => '<option value="' + esc(v) + '">').join("") + "</datalist>";
    return '<div class="backbar"><button class="back" type="button" data-act="editCancel">' + icon("back") + "Cancel</button></div>" +
      '<article class="recipe editing"><h1 class="r-title">Edit recipe</h1>' +
      (stale ? '<div class="note-review" role="alert">This recipe was updated since you started editing, so saving will be refused. ' +
        "Cancel and edit again to start from the new version.</div>" : "") +
      '<div class="ed-fields">' + field("name", "Name") + field("cuisine", "Cuisine", ' list="dlCuisine"') +
        field("type", "Type", ' list="dlType"') + field("time", "Time", ' placeholder="e.g. 25 min, 1 h 15 min"') + "</div>" +
      dl("dlCuisine", "cuisine") + dl("dlType", "type") +
      (edit.base.needs_review ? '<div class="ed-reviewed">' + switchRow("edReviewed", "Mark as reviewed", d.reviewed, "removes the Review tag") + "</div>" : "") +
      list("ingredients", "Ingredients", "Ingredient") + list("steps", "Steps", "Step") +
      '<p class="ed-hint">Return starts a new line. Amounts starting with ~ are estimates; TBD: marks a missing detail.</p>' +
      '<div class="ed-bar"><span class="ed-why" id="edWhy" aria-live="polite"></span>' +
        '<button class="btn ghost" type="button" data-act="editCancel">Cancel</button>' +
        '<button class="btn" type="button" id="edSave" data-act="editSave">Save</button></div>' +
      "</article>";
  }

  // After a redraw of the edit page: size the text boxes and put the focus back where it was.
  function afterRender() {
    if (!edit || current.name !== "r" || current.arg !== edit.id) return;
    document.querySelectorAll("textarea.ed-ta").forEach(grow);
    syncEditBar();
    const f = edit.focus;
    edit.focus = null;
    const el = f && $(f.sel);
    if (!el) return;
    el.focus({ preventScroll: true }); // synchronous, so iOS keeps the keyboard open
    if (el.tagName === "TEXTAREA") { const p = f.at === "start" ? 0 : el.value.length; el.setSelectionRange(p, p); }
    requestAnimationFrame(() => el.scrollIntoView({ block: "nearest" }));
  }

  // Typing in the edit page or the token box. Returns true when the event was handled.
  function onEditInput(el) {
    if (el.id === "tokIn") { tokDraft = el.value; return true; }
    if (!edit || !el.dataset) return false;
    if (el.dataset.ef) { edit.d[el.dataset.ef] = el.value; syncEditBar(); return true; }
    if (!el.dataset.el) return false;
    const key = el.dataset.el, i = +el.dataset.i, l = edit.d[key];
    if (!l || i >= l.length) return true;
    if (/\n/.test(el.value)) {
      // Pasted several lines: one item per line.
      const parts = el.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      l.splice(i, 1, ...(parts.length ? parts : [""]));
      edit.focus = { sel: '[data-el="' + key + '"][data-i="' + (i + Math.max(parts.length, 1) - 1) + '"]', at: "end" };
      refresh();
      return true;
    }
    l[i] = el.value;
    grow(el);
    syncEditBar();
    return true;
  }
  // Return in a line splits it at the cursor: the rest becomes a new item below.
  function onEditKey(e) {
    const el = e.target;
    if (e.key !== "Enter" || e.isComposing) return;
    if (el.id === "tokIn") { e.preventDefault(); saveToken(); return; }
    if (!edit || e.shiftKey || !el.classList || !el.classList.contains("ed-ta")) return;
    e.preventDefault();
    const key = el.dataset.el, i = +el.dataset.i, l = edit.d[key];
    if (!l) return;
    const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
    l[i] = el.value.slice(0, pos).trimEnd();
    l.splice(i + 1, 0, el.value.slice(pos).trimStart());
    edit.focus = { sel: '[data-el="' + key + '"][data-i="' + (i + 1) + '"]', at: "start" };
    refresh();
  }

  // Changed, added, removed and moved lines, like the bot's summary (edits.list_changes).
  function listDiff(a, b) {
    const split = (xs, other) => {
      const left = new Map();
      other.forEach((x) => left.set(x, (left.get(x) || 0) + 1));
      const kept = [], rest = [];
      xs.forEach((x) => { if (left.get(x) > 0) { left.set(x, left.get(x) - 1); kept.push(x); } else rest.push(x); });
      return [kept, rest];
    };
    const [ka, removed] = split(a, b), [kb, added] = split(b, a);
    // Kept lines outside the longest common order are the ones that changed place.
    const n = ka.length, m = kb.length;
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = ka[i] === kb[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const inOrder = new Set();
    for (let i = 0, j = 0; i < n && j < m;) {
      if (ka[i] === kb[j]) { inOrder.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
    }
    const moved = kb.filter((_, j) => !inOrder.has(j));
    // Pair each removed line with the most similar added line (shared letter pairs).
    const grams = (s) => { const t = fold(s), g = new Map(); for (let i = 0; i < t.length - 1; i++) { const k = t.slice(i, i + 2); g.set(k, (g.get(k) || 0) + 1); } return g; };
    const sim = (x, y) => {
      const gx = grams(x), gy = grams(y);
      let c = 0, nx = 0, ny = 0;
      gx.forEach((v, k) => { nx += v; c += Math.min(v, gy.get(k) || 0); });
      gy.forEach((v) => { ny += v; });
      return nx + ny ? (2 * c) / (nx + ny) : 0;
    };
    const out = [];
    removed.slice().forEach((x) => {
      let best = -1, score = 0.5;
      added.forEach((y, j) => { const s = sim(x, y); if (s > score) { best = j; score = s; } });
      if (best >= 0) { out.push(["changed", x, added[best]]); removed.splice(removed.indexOf(x), 1); added.splice(best, 1); }
    });
    return out.concat(added.map((x) => ["added", x]), removed.map((x) => ["removed", x]), moved.map((x) => ["moved", x]));
  }
  function summaryGroups() {
    const a = edit.base, b = editResult(), out = [];
    [["name", "Name"], ["cuisine", "Cuisine"], ["type", "Type"], ["time", "Time"]].forEach(([k, label]) => {
      if (a[k] !== b[k]) out.push({ h: label, rows: [["changed", a[k] || "(empty)", b[k] || (k === "time" ? "TBD" : "(empty)")]] });
    });
    [["ingredients", "Ingredients"], ["steps", "Steps"]].forEach(([k, label]) => {
      const rows = listDiff(a[k], b[k]);
      if (rows.length) out.push({ h: label, rows });
    });
    if (b.reviewed) out.push({ h: "Review", rows: [["note", "Marked as reviewed: the Review tag goes away."]] });
    return out;
  }
  const KIND_LABEL = { changed: "Changed", added: "Added", removed: "Removed", moved: "Moved", note: "" };
  function summaryBody() {
    const b = editResult();
    const tbd = b.reviewed && b.ingredients.concat(b.steps).some((s) => s.includes("TBD:"));
    const row = ([k, x, y]) => "<li>" + (KIND_LABEL[k] ? '<span class="k k-' + k + '">' + KIND_LABEL[k] + "</span> " : "") +
      (k === "changed" ? "<del>" + esc(x) + "</del> \u2192 " + esc(y) : k === "removed" ? "<del>" + esc(x) + "</del>" : esc(x)) + "</li>";
    return '<p class="sum-intro">Nothing is sent yet. <b>Send</b> creates an <b>edit</b> issue on GitHub; the bot checks it and updates ' +
      "the recipe, keeping its link and date. This usually takes about a minute, and older versions stay in the history.</p>" +
      summaryGroups().map((g) => '<section class="fgroup"><h3>' + esc(g.h) + '</h3><ul class="sum">' + g.rows.map(row).join("") + "</ul></section>").join("") +
      (tbd ? '<div class="note-review">Some lines still contain TBD:, but the recipe will be marked as reviewed.</div>' : "");
  }
  const summaryFoot = () => '<button class="btn ghost" type="button" data-act="closeSheet">Keep editing</button>' +
    '<button class="btn" type="button" data-act="editSend"' + (sending ? " disabled" : "") + ">" + (sending ? "Sending..." : "Send") + "</button>";

  // Changes sent but not yet in recipes.json: { <code>: { n: issue, kind, at: ms, v: editView JSON at send time } }.
  // Kept for this browser session; a note shows on the recipe until the change arrives (or 30 min pass).
  const PENDING_MS = 30 * 60000;
  const pending = {
    map: (() => { try { const m = JSON.parse(sessionStorage.getItem("rb.pending") || "{}"); return m && typeof m === "object" ? m : {}; } catch (_) { return {}; } })(),
    save() { try { sessionStorage.setItem("rb.pending", JSON.stringify(this.map)); } catch (_) {} },
    add(r, kind, n) { this.map[r._id] = { n, kind, at: Date.now(), v: JSON.stringify(editView(r)) }; this.save(); watchPending(); },
    get(id) { const p = this.map[id]; return p && Date.now() - p.at < PENDING_MS ? p : null; },
    prune() {
      let ch = false;
      Object.keys(this.map).forEach((id) => { if (!(Date.now() - this.map[id].at < PENDING_MS)) { delete this.map[id]; ch = true; } });
      if (ch) this.save();
    },
  };
  // Called whenever recipes.json changed: a recipe that now differs from the sent version has its change live.
  function checkPending() {
    let ch = false;
    Object.keys(pending.map).forEach((id) => {
      const p = pending.map[id], r = byId.get(id);
      if (!r || JSON.stringify(editView(r)) === p.v) return;
      delete pending.map[id];
      ch = true;
      ticks.set(id, { i: [], s: -1 }); // the lines changed, so old ticks would point at the wrong ones
      toast((p.kind === "reread" ? "Re-read" : "Edit") + " is live: " + r.name);
    });
    if (ch) pending.save();
  }
  // While something is pending, look for the new recipes.json every 20 s (not while editing).
  let pendingTimer = 0;
  function watchPending() {
    clearTimeout(pendingTimer);
    pending.prune();
    if (!Object.keys(pending.map).length) return;
    pendingTimer = setTimeout(async () => {
      if (document.visibilityState === "visible" && !edit && await load()) refresh();
      watchPending();
    }, 20000);
  }
  function pendingNote(r) {
    const p = pending.get(r._id);
    if (!p) return "";
    return '<div class="note-pending" role="status">' + (p.kind === "reread" ? "Re-read requested" : "Edit sent") + " (#" + esc(p.n) +
      "). It is usually live in about a minute; this page updates by itself. " +
      '<a href="https://github.com/' + esc(REPO) + "/issues/" + esc(p.n) + '" target="_blank" rel="noopener">Open on GitHub</a></div>';
  }

  // Token sheet, shown the first time something is sent (or when the saved token stopped working).
  let tokDraft = "", tokErr = "", tokNext = null, tokBusy = false;
  function openTokenSheet(next, err) {
    tokDraft = "";
    tokErr = err || "";
    tokNext = next || null;
    tokBusy = false;
    openSheet({ title: "GitHub token", body: tokenBody, foot: tokenFoot, onClose: () => { tokNext = null; } });
  }
  function tokenBody() {
    return '<p class="sum-intro">Edits are sent to GitHub with your own token. It is checked once, then kept <b>on this device only</b> ' +
      "and never included in a backup. You can remove it in Settings.</p>" +
      '<section class="fgroup"><h3>From your Shortcut</h3><ol class="howto">' +
        "<li>Open <b>Shortcuts</b>, then <b>Save Recipe</b>.</li>" +
        "<li>Open the <b>Get Contents of URL</b> action, then <b>Headers</b>.</li>" +
        "<li>Copy the <b>Authorization</b> value without &quot;Bearer &quot;.</li></ol></section>" +
      '<section class="fgroup"><h3>Or make a new token</h3><ol class="howto">' +
        "<li>On GitHub: <b>Settings</b>, then <b>Developer settings</b>, then <b>Fine-grained tokens</b>.</li>" +
        "<li>Give it access to only <b>recipes</b> and set <b>Issues</b> to Read and write.</li></ol></section>" +
      '<label class="ed-field tok"><span>Token</span><input class="ed-in" id="tokIn" type="password" autocomplete="off" ' +
        'autocapitalize="off" spellcheck="false" placeholder="github_pat_..." value="' + esc(tokDraft) + '"></label>' +
      (tokErr ? '<div class="note-review" role="alert">' + esc(tokErr) + "</div>" : "") +
      '<p class="ed-hint">Every GitHub Pages site on your account shares the address ' + esc(location.host || "github.io") +
        ", so another Pages site you publish there could read this token. It can only create issues in " + esc(REPO) +
        ", so the worst case is spam issues.</p>";
  }
  const tokenFoot = () => '<button class="btn ghost" type="button" data-act="closeSheet">Cancel</button>' +
    '<button class="btn" type="button" data-act="tokSave"' + (tokBusy ? " disabled" : "") + ">" + (tokBusy ? "Checking..." : "Check and save") + "</button>";
  async function saveToken() {
    if (tokBusy) return;
    const v = cleanToken(tokDraft);
    if (!v) { tokErr = "Paste the token first."; renderSheet(); return; }
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v)) {
      tokErr = 'That does not look like a GitHub token. It starts with "github_pat_".';
      renderSheet();
      return;
    }
    tokBusy = true;
    tokErr = "";
    renderSheet();
    try {
      await ghApi("GET", "", null, v); // one check: the token is valid and can see the repository
    } catch (e) {
      tokBusy = false;
      tokErr = e.status === 403 || e.status === 404 ? "This token cannot see " + REPO + ". Give it access to the recipes repository." : e.message;
      renderSheet();
      return;
    }
    tokBusy = false;
    token.set(v);
    const next = tokNext;
    closeSheet(true);
    toast("Token saved on this device");
    if (next) next();
  }
  function withToken(fn) { if (token.get()) fn(); else openTokenSheet(fn); }
  function msgSheet(title, text) {
    openSheet({ title, body: () => '<p class="sum-intro">' + esc(text) + "</p>",
      foot: () => '<button class="btn" type="button" data-act="closeSheet">OK</button>' });
  }

  // The request travels as a ```json block at the end of the issue body; the text above it is for people.
  function issueBody(intro, lines, data) {
    return intro + (lines.length ? "\n\n" + lines.join("\n") : "") +
      "\n\n<!-- Read by the recipebot workflow. Please do not edit the block below. -->\n```json\n" +
      JSON.stringify(data, null, 1) + "\n```\n";
  }
  async function postIssue(title, body, labels, retry) {
    sending = true;
    if (sheet) renderSheet(); else toast("Sending...");
    try {
      return await ghApi("POST", "/issues", { title: title.slice(0, 200), body, labels });
    } catch (e) {
      if (e.status === 401) {
        token.clear();
        openTokenSheet(retry, e.message + " Paste a new token to send it.");
      } else {
        msgSheet("Not sent", e.message + (edit ? " Your changes are kept, so you can try again." : ""));
      }
      return null;
    } finally {
      sending = false;
      renderSheet();
    }
  }
  async function sendEdit() {
    if (!edit || sending) return;
    const r = byId.get(edit.id);
    if (!r) { msgSheet("Not sent", "This recipe is no longer in the library."); return; }
    const res = editResult();
    const lines = [];
    summaryGroups().forEach((g) => g.rows.forEach(([k, x, y]) => {
      lines.push("- " + g.h + ": " + (k === "changed" ? x + " \u2192 " + y : (k === "note" ? "" : k + " ") + x));
    }));
    const body = issueBody("Edit made on the website for " + r.url, lines,
      { recipebot: "edit", v: 1, url: r.url, base: edit.base, new: res });
    if (body.length > 60000) { msgSheet("Too long to send", "This edit is too long for one GitHub issue. Shorten some lines and try again."); return; }
    const sent = await postIssue("Edit: " + res.name, body, ["edit", "queued"], sendEdit);
    if (!sent) return;
    pending.add(r, "edit", sent.number);
    edit = null;
    closeSheet(true);
    render();
    window.scrollTo(0, 0);
    toast("Edit sent");
  }
  async function sendReread(r) {
    if (sending) return;
    const body = issueBody("Re-read the ingredients and steps of this recipe from the video: " + r.url, [],
      { recipebot: "reread", v: 1, url: r.url });
    const sent = await postIssue("Re-read: " + r.name, body, ["reread", "queued"], () => sendReread(r));
    if (!sent) return;
    pending.add(r, "reread", sent.number);
    refresh();
    toast("Re-read requested");
  }

  const VIEWS = { "": viewHome, browse: viewBrowse, saved: viewSaved, list: viewList, r: viewRecipe };
  const TABS = [["", "Home", "home"], ["browse", "Browse", "browse"], ["saved", "Saved", "heart"], ["list", "List", "list"]];

  function renderTabs() {
    const active = current.name === "r" ? null : current.name;
    const open = shop.open(); // items still to buy, shown as a badge on the List tab
    $("#tabs").innerHTML = TABS.map(([name, label, ic]) =>
      '<a class="tab" href="#/' + name + '"' + (active === name ? ' aria-current="page"' : "") + ">" +
      icon(ic) + "<span>" + label + "</span>" +
      (name === "list" && open ? '<span class="count"><span class="sr">, </span>' + open + '<span class="sr"> to buy</span></span>' : "") +
      "</a>").join("");
  }

  function titleFor() {
    if (current.name === "r") { const r = byId.get(current.arg); return r ? r.name + " \u00b7 Recipes" : "Recipes"; }
    const t = TABS.find(([n]) => n === current.name);
    return t && t[0] ? t[1] + " \u00b7 Recipes" : "Recipes";
  }

  function render() {
    renderTabs();
    const app = $("#app");
    if (rawText == null && !loadError) {
      app.innerHTML = '<div class="state"><div class="spinner"></div>Loading recipes...</div>';
      return;
    }
    if (loadError) {
      app.innerHTML = '<div class="state"><b>Could not load recipes</b>' + esc(loadError) +
        '<br><button class="btn" type="button" data-act="reload">Try again</button></div>';
      return;
    }
    app.innerHTML = VIEWS[current.name](current.arg);
    afterRender();
    document.title = titleFor();
  }

  // Re-render the current view without moving the page. An open sheet is redrawn too, so its
  // counts match the new data.
  function refresh() {
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    renderSheet();
  }

  /* ================= routing ================= */
  // #/  #/browse  #/saved  #/list  #/r/<code>
  let current = { name: "", arg: "", key: "" };
  let routed = false; // false until the first route(), so a reload does not overwrite the saved scroll

  // Each history entry made inside the app gets an index. The entry the visitor landed on is 0,
  // so in-app Back only calls history.back() when there is an app page behind us.
  let histIdx = 0;
  function stampHistory(isNew) {
    const s = history.state;
    if (s && typeof s.idx === "number") { histIdx = s.idx; return; }
    histIdx = isNew ? histIdx + 1 : 0;
    history.replaceState({ idx: histIdx }, "");
  }

  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    const name = parts[0] || "";
    const arg = safeDecode(parts.slice(1).join("/"));
    return { name, arg, key: name + (arg ? "/" + arg : "") };
  }

  function go(hash, replace) {
    if (replace) { history.replaceState({ idx: histIdx }, "", hash); route(); }
    else location.hash = hash;
  }

  function route() {
    closeSheet(true); // e.g. the browser Back button while a sheet is open
    if (routed) saveScroll(current.key);
    routed = true;
    const r = parseHash();
    if (!(r.name in VIEWS)) {
      // Links from the old site were #/<code>.
      if (byId.has(r.name)) return go("#/r/" + encodeURIComponent(r.name), true);
      if (rawText != null) return go("#/", true);
    }
    current = r.name in VIEWS ? r : { name: "", arg: "", key: "" };
    if (current.name === "r" && byId.has(current.arg)) noteRecent(current.arg);
    render();
    window.scrollTo(0, scrolls[current.key] || 0);
    wake.sync(); // takes the screen lock on a recipe page, releases it everywhere else
  }

  // Shows or hides "Add unticked (n)" on the recipe page after a tick changes.
  function syncUnticked() {
    const r = byId.get(current.arg), b = $("#addUnticked");
    if (!r || !b) return;
    const n = untickedCount(r, ticks.get(r._id));
    b.hidden = !(n > 0 && n < r.ingredients.length);
    $("#untickedN").textContent = String(n);
  }

  // Opens Browse with a fresh search and filters, e.g. from a Home tile or "See all".
  function browseWith(patch) {
    clearTimeout(qTimer);
    Object.assign(bstate, browseDefault(), patch);
    saveBrowse();
    scrolls.browse = 0;
    go("#/browse");
  }

  // Shopping list as plain text, only the items still to buy.
  function listText() {
    return shop.groups.map((g) => {
      const items = g.items.filter((it) => !it.c);
      return items.length ? (g.name || "Recipe") + "\n" + items.map((it) => "- " + it.t).join("\n") : "";
    }).filter(Boolean).join("\n\n");
  }

  /* ================= actions (event delegation via data-act) ================= */
  const ACTIONS = {
    back() {
      if (histIdx > 0) history.back();
      else go("#/", true);
    },
    async reload() {
      loadError = "";
      render();
      await load();
      route();
    },
    // Heart on a card or on the recipe page. Updates every heart for that recipe in place.
    save(el) {
      const id = el.dataset.id;
      const on = saved.toggle(id);
      document.querySelectorAll('[data-act="save"]').forEach((b) => {
        if (b.dataset.id !== id) return;
        b.setAttribute("aria-pressed", String(on));
        b.classList.remove("pop");
        if (on) { void b.offsetWidth; b.classList.add("pop"); }
      });
      // Lists that depend on saved state are redrawn so the card disappears straight away.
      if (current.name === "saved") refresh();
      else if (current.name === "browse" && bstate.savedOnly) updateResults();
      toast(on ? "Saved" : "Removed from Saved");
    },
    ingOnly(el) {
      bstate.ing = !bstate.ing;
      el.setAttribute("aria-pressed", String(bstate.ing));
      saveBrowse();
      updateResults();
    },
    clearSearch() {
      clearTimeout(qTimer);
      bstate.q = "";
      saveBrowse();
      const q = $("#q");
      if (q) { q.value = ""; q.focus(); }
      updateResults();
    },
    // Keeps the chosen sort; clears the search, Ingredients only and every filter.
    clearBrowse() {
      clearTimeout(qTimer);
      Object.assign(bstate, browseDefault(), { sort: bstate.sort });
      saveBrowse();
      refresh();
    },
    openFilters() {
      openSheet({ title: "Filters", body: filterSheetBody, foot: filterSheetFoot });
    },
    closeSheet() { closeSheet(); },
    fChip(el) {
      const list = bstate[FIELD[el.dataset.g]];
      if (!list) return;
      const i = list.indexOf(el.dataset.v);
      if (i >= 0) list.splice(i, 1); else list.push(el.dataset.v);
      afterFilter();
    },
    rmFilter(el) {
      const g = el.dataset.g, v = el.dataset.v;
      if (FIELD[g]) bstate[FIELD[g]] = bstate[FIELD[g]].filter((x) => x !== v);
      else if (g === "saved") bstate.savedOnly = false;
      else if (g === "review") bstate.review = true;
      afterFilter();
    },
    fClear() {
      clearFilters();
      afterFilter();
    },
    // Recipe page. These update the page in place so the scroll position does not move.
    tickIng(el) {
      const id = current.arg, i = +el.dataset.i;
      const t = ticks.get(id);
      const k = t.i.indexOf(i);
      if (k >= 0) t.i.splice(k, 1); else t.i.push(i);
      ticks.set(id, t);
      el.classList.toggle("on", k < 0);
      el.setAttribute("aria-checked", String(k < 0));
      const rb = $("#resetTicks");
      if (rb) rb.hidden = !t.i.length;
      syncUnticked();
    },
    tickStep(el) {
      const id = current.arg, i = +el.dataset.i;
      const t = ticks.get(id);
      t.s = t.s === i ? -1 : i;
      ticks.set(id, t);
      document.querySelectorAll(".step").forEach((b) => {
        const on = +b.dataset.i === t.s;
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", String(on));
      });
    },
    resetTicks() {
      const id = current.arg;
      const t = ticks.get(id);
      t.i = [];
      ticks.set(id, t);
      document.querySelectorAll(".ing.on").forEach((b) => { b.classList.remove("on"); b.setAttribute("aria-checked", "false"); });
      const rb = $("#resetTicks");
      if (rb) rb.hidden = true;
      syncUnticked();
    },
    rtab(el) {
      const t = el.dataset.t === "steps" ? "steps" : "ing";
      rtabs[current.arg] = t;
      saveRtabs();
      const cols = $(".r-cols");
      if (cols) cols.dataset.tab = t;
      document.querySelectorAll('.seg [role="tab"]').forEach((b) => b.setAttribute("aria-selected", String(b.dataset.t === t)));
    },
    // Native share sheet where available (iOS), otherwise copy the recipe link.
    async share() {
      const r = byId.get(current.arg);
      if (!r) return;
      const url = location.href;
      if (navigator.share) {
        try { await navigator.share({ title: r.name, url }); } catch (_) { /* cancelled */ }
        return;
      }
      try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch (_) { toast("Could not copy the link"); }
    },
    // Shopping list.
    addList(el) {
      const r = byId.get(current.arg);
      if (!r) return;
      const t = ticks.get(r._id);
      const texts = el.dataset.m === "unticked" ? r.ingredients.filter((_, i) => !t.i.includes(i)) : r.ingredients;
      const n = shop.add(r, texts);
      renderTabs();
      toast(n ? "Added " + plural(n, "item") + " to the list" : "Already on the list");
    },
    tickList(el) {
      const g = shop.groups[+el.dataset.g];
      const it = g && g.items[+el.dataset.i];
      if (!it) return;
      it.c = !it.c;
      shop.save();
      refresh();
    },
    rmGroup(el) {
      const g = shop.groups[+el.dataset.g];
      if (!g) return;
      shop.groups.splice(+el.dataset.g, 1);
      shop.save();
      refresh();
      toast("Removed " + (g.name || "recipe") + " from the list");
    },
    clearChecked() {
      shop.groups.forEach((g) => { g.items = g.items.filter((it) => !it.c); });
      shop.save();
      refresh();
    },
    // Share sheet on phones (Notes, Messages, Reminders...), clipboard elsewhere.
    async shareList() {
      const text = listText();
      if (!text) { toast("Nothing left to buy"); return; }
      if (navigator.share && matchMedia("(pointer: coarse)").matches) {
        try { await navigator.share({ title: "Shopping list", text }); } catch (_) { /* cancelled */ }
        return;
      }
      try { await navigator.clipboard.writeText(text); toast("List copied"); } catch (_) { toast("Could not copy the list"); }
    },
    // Home.
    typeTile(el) { browseWith({ types: [el.dataset.v] }); },
    cuisineTile(el) { browseWith({ cuisines: [el.dataset.v] }); },
    seeNewest() { browseWith({ sort: "new" }); },
    // Next spotlight pick; only that row is redrawn and scrolled back to its start.
    shuffle() {
      spotShift++;
      const row = $(".row.spot");
      if (!row) return;
      row.innerHTML = spotlight().map((r) => card(r)).join("");
      row.scrollLeft = 0;
    },
    // Settings.
    openSettings() { openSheet({ title: "Settings", body: settingsBody }); },
    exportData() { exportData(); },
    tokAdd() { openTokenSheet(null); },
    tokSave() { saveToken(); },
    tokForget() {
      if (!confirm("Remove the GitHub token from this device? You will be asked for it again the next time you send an edit.")) return;
      token.clear();
      renderSheet();
      toast("Token removed from this device");
    },
    // Editing.
    editStart() {
      const r = byId.get(current.arg);
      if (!r) return;
      if (edit && edit.id === r._id) { render(); return; }
      if (edit && editDirty() && !confirm("Discard your unsaved changes to the other recipe?")) return;
      if (pending.get(r._id) && !confirm("An earlier change to this recipe is still being applied. " +
        "If you edit now, this edit will be refused once that change lands. Edit anyway?")) return;
      const v = editView(r);
      edit = {
        id: r._id, base: v, focus: null,
        d: { name: v.name, cuisine: v.cuisine, type: v.type, time: v.time, ingredients: v.ingredients.slice(), steps: v.steps.slice(), reviewed: false },
      };
      if (!edit.d.ingredients.length) edit.d.ingredients.push("");
      if (!edit.d.steps.length) edit.d.steps.push("");
      render();
      window.scrollTo(0, 0);
    },
    editCancel() {
      if (editDirty() && !confirm("Discard your changes?")) return;
      edit = null;
      render();
      window.scrollTo(0, 0);
    },
    edMove(el) {
      const key = el.dataset.l, l = edit && edit.d[key];
      const i = +el.dataset.i, dir = +el.dataset.d, j = i + dir;
      if (!l || j < 0 || j >= l.length) return;
      [l[i], l[j]] = [l[j], l[i]];
      // Keep the focus on the same arrow so the line can be moved again; at the end use the other arrow.
      const more = dir < 0 ? j > 0 : j < l.length - 1;
      edit.focus = { sel: '[data-act="edMove"][data-l="' + key + '"][data-i="' + j + '"][data-d="' + (more ? dir : -dir) + '"]' };
      refresh();
    },
    edDel(el) {
      const l = edit && edit.d[el.dataset.l];
      if (!l) return;
      l.splice(+el.dataset.i, 1);
      if (!l.length) l.push("");
      refresh();
      toast("Line deleted");
    },
    edAdd(el) {
      const key = el.dataset.l, l = edit && edit.d[key];
      if (!l) return;
      l.push("");
      edit.focus = { sel: '[data-el="' + key + '"][data-i="' + (l.length - 1) + '"]', at: "end" };
      refresh();
    },
    editSave() {
      const p = edit && editProblem();
      if (p) { toast(p); return; }
      if (edit) openSheet({ title: "Check your changes", body: summaryBody, foot: summaryFoot });
    },
    editSend() { withToken(sendEdit); },
    reread() {
      const r = byId.get(current.arg);
      if (!r) return;
      if (!confirm("Re-read the ingredients and steps from the video?\n\nThis replaces both lists, including any changes you " +
        "made by hand. Name, cuisine, type, time and date stay.")) return;
      withToken(() => sendReread(r));
    },
  };

  // Search box: short debounce, then update the results only.
  let qTimer = 0;
  document.addEventListener("input", (e) => {
    if (onEditInput(e.target)) return;
    if (e.target.id !== "q") return;
    const v = e.target.value;
    $("#qclear").hidden = !v;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { bstate.q = v.trim(); saveBrowse(); updateResults(); }, 120);
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.id === "q" && e.key === "Enter") e.target.blur(); // hides the iOS keyboard
    if (e.key === "Escape" && sheet) closeSheet();
    onEditKey(e);
  });
  document.addEventListener("change", (e) => {
    const id = e.target.id;
    if (id === "sort") {
      bstate.sort = sortDef(e.target.value)[0];
      $("#sortLabel").textContent = sortDef(bstate.sort)[1];
      saveBrowse();
      updateResults();
    } else if (id === "fSaved") {
      bstate.savedOnly = e.target.checked;
      afterFilter();
    } else if (id === "fReview") {
      bstate.review = e.target.checked;
      afterFilter();
    } else if (id === "wakeSw") {
      wake.on = e.target.checked;
      store.set("keepAwake", wake.on, true);
      if (wake.on) wake.acquire(true); else wake.release();
    } else if (id === "edReviewed") {
      if (edit) { edit.d.reviewed = e.target.checked; syncEditBar(); }
    } else if (id === "importFile") {
      const f = e.target.files && e.target.files[0];
      e.target.value = ""; // so choosing the same file again still fires change
      if (f) importData(f);
    }
  });

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  window.addEventListener("hashchange", () => { stampHistory(true); route(); });
  window.addEventListener("scroll", () => {
    if (routed) saveScroll(current.key);
    // Thin line under the sticky search bar once the page scrolls beneath it.
    const bar = $("#bbar");
    if (bar) bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= parseFloat(getComputedStyle(bar).top) + 0.5 && window.scrollY > 0);
  }, { passive: true });

  // Coming back to the app: fetch quietly and only re-render if recipes.json changed.
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible") return;
    wake.sync();
    if (await load()) refresh();
  });

  // Closing or reloading the page with an unsaved edit asks first.
  window.addEventListener("beforeunload", (e) => { if (editDirty()) { e.preventDefault(); e.returnValue = ""; } });

  /* ================= start ================= */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  stampHistory(false);
  if (store.keys().length) askPersist();
  current = parseHash();
  render();
  load().then(() => { route(); watchPending(); });
})();
</script>
</body>
</html>

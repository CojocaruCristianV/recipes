# recipebot configuration (committed). Secrets live in GitHub Secrets / local .env.

[gemini]
# Default model. Override without a commit via the repo variable GEMINI_MODEL
# (or GEMINI_MODEL in .env locally, or the "model" input of Run workflow).
# List the IDs your key can use: python -m recipebot --list-models
model = "gemini-3.8-flash"
# Backup models, tried in this order (newest first, lite last) when the current model
#   - has used up its quota (429): it is skipped for the rest of the run,
#   - is not found / not supported: it is skipped for the rest of the run,
#   - is busy (503, 5xx, timeout): the next one is tried at once; busy_waits_s only
#     starts once every model in the list was busy.
# The model that answers stays in use for the rest of the run.
fallback_models = ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"]
temperature = 0.2
# Media below this total size is sent inline; larger media goes through the File API.
inline_max_mb = 20
# Max seconds to wait for an uploaded video to become ACTIVE.
file_poll_timeout_s = 300
# Videos always go through the File API (uploaded once, reused by every retry).
upload_video = true
# When every model is busy (503 "high demand", 5xx, timeout) wait this long, then try again
# from the top of the list. One entry per round. All within the same run; afterwards the
# link stays queued.
busy_waits_s = [30, 60, 120]
# A single request that takes longer than this counts as busy and is retried.
request_timeout_s = 240
# Busy retries of a video request use low media resolution (about 4x fewer tokens).
light_retry = true
# How much the model "thinks" before answering: MINIMAL, LOW, MEDIUM, HIGH or "" (model default).
# Extraction needs little reasoning; LOW is faster and less likely to hit busy errors.
# Switched off automatically if the model does not support it.
thinking_level = "LOW"
# Minimum seconds between two Gemini requests (the free tier allows about 10-15 per minute).
min_interval_s = 4.5
# A 429 that is a per-minute limit (not the daily quota) waits this long and retries the same
# model, one entry per retry. Only a daily-quota 429 takes a model out for the rest of the run.
rpm_waits_s = [20, 40]

[fetch]
# Fetcher chain for GitHub-hosted runs. Valid: "apify", "ytdlp".
order = ["apify", "ytdlp"]
# Fetcher chain for the optional self-hosted runner (needs-local issues).
local_order = ["ytdlp"]
# CONFIG VALUE: Apify actor used to scrape a single post/reel.
apify_actor = "apify/instagram-scraper"
apify_timeout_s = 180
# Media download limits.
max_media_mb = 200
max_images = 10

[web]
# Look for the full recipe on the web when the caption does not contain it: links in the
# caption and in the creator's comments, then the creator's bio links (link pages and the
# creator's own site, searched for the dish). Paid or paywalled recipes are never used.
enabled = true
# Read the creator's bio links (one extra Apify run per creator and run).
follow_bio_links = true
# Sites that block plain requests are fetched through this Apify actor instead.
apify_fallback = true
apify_actor = "apify/cheerio-scraper"
apify_timeout_s = 120
max_apify_runs = 2
# Limits per recipe: pages fetched, recipe pages opened, bio links followed, seconds spent.
max_fetches = 15
max_pages = 6
max_bio_links = 3
max_seconds = 120
timeout_s = 12
max_page_mb = 3
# Page text sent to Gemini when a page has no structured recipe data.
max_text_chars = 12000
# How closely a page's recipe name must match the post's dish (0-1).
min_name_score = 0.7
# Link-in-bio services: their pages are lists of links, never the recipe itself.
link_pages = [
  "linktr.ee", "beacons.ai", "stan.store", "linkin.bio", "lnk.bio", "campsite.bio", "hoo.be",
  "bio.site", "carrd.co", "taplink.cc", "solo.to", "msha.ke", "komi.io", "flow.page", "linkpop.com",
  "allmylinks.com", "snipfeed.co", "milkshake.app", "later.com",
]
# Never fetched: social networks, shops, affiliate and link-shortener hosts, video sites.
skip_hosts = [
  "instagram.com", "facebook.com", "fb.com", "tiktok.com", "youtube.com", "youtu.be", "x.com",
  "twitter.com", "threads.net", "pinterest.com", "pin.it", "snapchat.com", "linkedin.com",
  "spotify.com", "apple.com", "amazon.*", "amzn.to", "a.co", "amzlink.to", "liketk.it", "ltk.app",
  "shopltk.com", "shopmy.us", "taap.it", "tapthe.link", "geni.us", "bit.ly", "tinyurl.com",
  "gotourl.es", "lnk.to", "teachable.com", "gumroad.com", "patreon.com", "kit.com", "convertkit.com",
  "substack.com", "etsy.com", "ebay.*", "walmart.com", "target.com", "givebrite.com", "gofundme.com",
  "google.com", "goo.gl", "wa.me", "t.me", "discord.gg", "onlyfans.com",
]

[run]
# Upper bound of items per run and a time budget that keeps the job under its 15 min timeout.
# Items not reached stay "queued" and are picked up by the next run.
max_items_per_run = 15
run_budget_s = 660
# Seconds after the start when Gemini waits / calls stop, so publishing always fits the 15 min job.
hard_deadline_s = 720
timezone = "Europe/Bucharest"
max_push_attempts = 5

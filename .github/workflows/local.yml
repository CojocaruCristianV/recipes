name: local-fallback

# Optional. Processes "needs-local" issues on a self-hosted Windows runner (home IP, yt-dlp).
# Off unless the repo variable USE_LOCAL_RUNNER is "true". Kept in its own workflow and
# concurrency group so a job waiting for an offline PC never blocks the main queue.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

# Read-only by default; each job asks for only what it needs.
permissions:
  contents: read

concurrency:
  group: recipes-local
  cancel-in-progress: false

jobs:
  local:
    if: vars.USE_LOCAL_RUNNER == 'true'
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    # Pushes recipes.json and labels / comments on / closes issues. No Pages access.
    permissions:
      contents: write
      issues: write
    outputs:
      published: ${{ steps.run.outputs.published }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          clean: true

      - name: Python venv (yt-dlp always latest)
        run: |
          if not exist "%RUNNER_TEMP%\rbvenv\Scripts\python.exe" py -3.12 -m venv "%RUNNER_TEMP%\rbvenv"
          "%RUNNER_TEMP%\rbvenv\Scripts\python.exe" -m pip install -q -r requirements.txt
          "%RUNNER_TEMP%\rbvenv\Scripts\python.exe" -m pip install -q -U yt-dlp

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process needs-local issues
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IG_COOKIES_B64: ${{ secrets.IG_COOKIES_B64 }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: '"%RUNNER_TEMP%\rbvenv\Scripts\python.exe" -m recipebot --all-queued --local'

      - name: Clean workspace
        if: always()
        shell: powershell
        run: Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

  deploy:
    needs: local
    if: >-
      !cancelled() && needs.local.result != 'skipped' && needs.local.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishes the site only. Cannot push to the repo or touch issues.
    # actions: read lets the wait step list this run's artifacts.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      # A syntax error in index.html blanks the whole site, so never publish one.
      - name: Check site files
        run: node scripts/check-site.mjs index.html recipes.json
      - run: |
          mkdir -p _site
          cp index.html recipes.json _site/
      # Artifacts are shared by all attempts of a run, so a re-run would add a second
      # "github-pages" artifact and deploy-pages would refuse. Name it per attempt.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # The artifact list can lag behind the upload, which makes deploy-pages report
      # "No artifacts named ... were found". Wait until it is listed.
      - name: Wait for artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$NAME" --jq .total_count || true)
            if [ "${n:-0}" -ge 1 ]; then echo "Artifact $NAME is listed"; exit 0; fi
            echo "Artifact not listed yet ($i/12)"; sleep 5
          done
          echo "::warning::Artifact $NAME still not listed after 60s; deploying anyway"
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

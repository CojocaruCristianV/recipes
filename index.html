<body>
<div class="statusbar" aria-hidden="true"></div>
<main id="app"></main>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-in">
    <a class="brand" href="#/">Recipes</a>
    <div class="tabs" id="tabs"></div>
  </div>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  /* ================= helpers ================= */
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Lowercase and strip accents, so "creme" matches "Creme" with an accent.
  const fold = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const arr = (v) => (Array.isArray(v) ? v.map(str).filter(Boolean) : []);
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many || one + "s");
  const igCode = (url) => (String(url || "").match(/\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/) || [])[1] || "";
  const safeDecode = (s) => { try { return decodeURIComponent(s); } catch (_) { return s; } };

  /* ================= icons (inline SVG, drawn in code) ================= */
  const ICON = {
    home: '<path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/>',
    browse: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
    heart: '<path d="M12 20s-7.2-4.4-8.9-9.1C2 7.6 4.1 4.5 7.3 4.5c1.9 0 3.5 1 4.7 2.7 1.2-1.7 2.8-2.7 4.7-2.7 3.2 0 5.3 3.1 4.2 6.4C19.2 15.6 12 20 12 20z"/>',
    list: '<path d="M10 6.5h10M10 12h10M10 17.5h10"/><path d="m3.8 6.5 1.2 1.2 2.2-2.4M3.8 12l1.2 1.2 2.2-2.4M3.8 17.5l1.2 1.2 2.2-2.4"/>',
    back: '<path d="m14.5 18-6-6 6-6"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    chevDown: '<path d="m6.5 9.5 5.5 5.5 5.5-5.5"/>',
    sort: '<path d="M7 4.5v15M3.5 16 7 19.5 10.5 16M17 19.5v-15M13.5 8 17 4.5 20.5 8"/>',
    sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    share: '<path d="M12 3.5v11"/><path d="m8 7.5 4-4 4 4"/><path d="M7 11H5.5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H17"/>',
    insta: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17 7h.01"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    dice: '<rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/><circle cx="12" cy="12" r="6.6"/>',
    // Recipe type icons, used on the generated covers.
    main: '<circle cx="12.5" cy="12" r="5.5"/><path d="M2.5 4v4.5a1.5 1.5 0 0 0 3 0V4M4 10v10M21.5 4c-1.4 0-2.3 2.2-2.3 5.2 0 1.6.9 2.3 2.3 2.3V20"/>',
    soup: '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7.5c0-1.2 1-1.6 1-2.8M12 7.5c0-1.2 1-1.6 1-2.8M16 7.5c0-1.2 1-1.6 1-2.8"/>',
    salad: '<path d="M5 19C5 10.5 10 5.5 20 4c-1.2 9.8-6.2 15-15 15z"/><path d="M5 19 13.5 10.5"/>',
    condiment: '<path d="M9 9h6l1 3v8a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-8z"/><path d="M10.5 9V6h3v3M12 6V3"/>',
    sauce: '<path d="M10 3h4v3l2 3v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><path d="M8 13.5h8"/>',
    dressing: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>',
    pickle: '<path d="M7 7h10v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M8 3.5h8V7H8z"/><path d="M9.5 12.5c1.5-1 3.5-1 5 0M9.5 16.5c1.5-1 3.5-1 5 0"/>',
    ferment: '<path d="M7 7h10v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M8 3.5h8V7H8z"/><circle cx="10.5" cy="16" r="1.3"/><circle cx="13.5" cy="12" r="1"/><circle cx="14" cy="17.5" r=".6"/>',
    spice: '<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="m13.5 11 6-8"/><path d="M9 21h6"/>',
    bread: '<path d="M5 20v-8.5A3.5 3.5 0 0 1 6.5 5h11a3.5 3.5 0 0 1 1.5 6.5V20z"/><path d="m9 10 1.5-1.5M12.5 10 14 8.5"/>',
    dessert: '<rect x="4" y="11" width="16" height="9" rx="1.5"/><path d="M4 15c2.7 0 2.7 1.5 5.3 1.5S12 15 14.7 15s2.6 1.5 5.3 1.5"/><path d="M12 11V7.5M12 4.5v.01"/>',
    drink: '<path d="M6 7h12l-1.5 13a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1z"/><path d="m13 7 3-4h3"/><path d="M6.6 12h10.8"/>',
    breakfast: '<path d="M12 3c4 0 7 3.6 7 8.2C19 16.3 15.6 21 12 21s-7-4.7-7-9.8C5 6.6 8 3 12 3z"/><circle cx="12" cy="13" r="3"/>',
    snack: '<circle cx="12" cy="12" r="8.5"/><path d="M9 9h.01M14.5 8.5h.01M15 14.5h.01M9.5 15h.01M12 12h.01"/>',
    side: '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8.5 8c1.2-1.6 5.8-1.6 7 0"/>',
    dish: '<path d="M3 18h18"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 9V7M10.5 7h3"/>',
  };
  const icon = (name, cls, sw) => '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    (ICON[name] || ICON.dish) + "</svg>";

  /* ================= recipe types: cover gradient + icon ================= */
  // Warm gradients per known type (see prompts/system.txt). Unknown types get sand to caramel.
  const TYPE_STYLE = {
    "main": ["#ec9468", "#b4482a", "main"],
    "soup": ["#f4b66c", "#cc642c", "soup"],
    "salad": ["#cfcf8e", "#7d8a3a", "salad"],
    "condiment": ["#f3d272", "#c18c26", "condiment"],
    "sauce": ["#e98f74", "#a33b2c", "sauce"],
    "dressing": ["#f5d98e", "#cf9536", "dressing"],
    "pickle": ["#d9d58e", "#8c8834", "pickle"],
    "ferment": ["#dba08f", "#8b4a48", "ferment"],
    "spice blend": ["#eda46c", "#9a4721", "spice"],
    "bread": ["#f2d29b", "#bd8642", "bread"],
    "dessert": ["#f4b6a3", "#bf5d5c", "dessert"],
    "drink": ["#f6c6a2", "#d27650", "drink"],
    "breakfast": ["#f8da80", "#dc9536", "breakfast"],
    "snack": ["#f2ba7c", "#b56733", "snack"],
    "side": ["#dfc89c", "#977746", "side"],
  };
  const TYPE_DEFAULT = ["#ecdcc0", "#b57a41", "dish"];
  function typeStyle(type) {
    const k = fold(type).trim();
    return TYPE_STYLE[k] || TYPE_STYLE[k.replace(/s$/, "")] || TYPE_DEFAULT;
  }

  /* ================= time text -> minutes ================= */
  // "15 min" = 15, "1 h 15 min" = 75, "20 min + 24 h" = 1460, "25-30 min" = 30 (ranges count the
  // longer time), "1 h - 1 h 30 min" = 90. Parts joined by "+" are added up. Returns null if unknown.
  const UNIT_MIN = { d: 1440, h: 60, m: 1 };
  const QTY = /(\d+(?:[.,]\d+)?)(?:\s*(?:-|\u2013|to)\s*(\d+(?:[.,]\d+)?))?\s*(days?|d|hours?|hrs?|h|minutes?|mins?|m)(?![a-z])/g;
  const num = (s) => parseFloat(String(s).replace(",", "."));
  function parseMinutes(text) {
    const t = String(text || "").toLowerCase().trim();
    if (!t) return null;
    if (/^\d+$/.test(t)) return +t;
    let total = 0;
    let found = false;
    t.split("+").forEach((part) => {
      let best = 0;
      part.split(/\s(?:-|\u2013|to|or)\s/).forEach((alt) => {
        let sum = 0;
        alt.replace(QTY, (_, a, b, unit) => {
          sum += Math.max(num(a), b ? num(b) : 0) * UNIT_MIN[unit[0]];
          found = true;
          return "";
        });
        best = Math.max(best, sum);
      });
      total += best;
    });
    return found ? Math.round(total) : null;
  }
  // 75 -> "1 h 15 min", 1460 -> "24 h 20 min". Days are only used from 2 days on.
  function fmtMinutes(m) {
    if (m == null) return "";
    if (m < 60) return m + " min";
    if (m < 2880) { const h = Math.floor(m / 60), r = m % 60; return h + " h" + (r ? " " + r + " min" : ""); }
    const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
    return d + " d" + (h ? " " + h + " h" : "");
  }

  /* ================= saved data (localStorage, keyed by Instagram code) ================= */
  // Every key is prefixed with "rb." so Export / Import can find them all.
  const PREFIX = "rb.";
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v == null ? fallback : JSON.parse(v);
      } catch (_) { return fallback; }
    },
    // quiet = true for preferences (search, sort...), so only real data triggers the persist request.
    set(key, value, quiet) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (_) { /* full or blocked */ }
      if (!quiet) askPersist();
    },
    remove(key) { try { localStorage.removeItem(PREFIX + key); } catch (_) {} },
    keys() {
      const out = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX)) out.push(k.slice(PREFIX.length));
        }
      } catch (_) {}
      return out;
    },
  };

  // Ask the browser not to evict our data. Done once per page load, the first time
  // something is saved (or at start-up when saved data already exists). Never prompts on iOS.
  let persistAsked = false;
  function askPersist() {
    if (persistAsked) return;
    persistAsked = true;
    try {
      const s = navigator.storage;
      if (s && s.persist && s.persisted) s.persisted().then((ok) => ok || s.persist()).catch(() => {});
    } catch (_) {}
  }

  // Saved recipes: { <instagram code>: <time saved, ms> }.
  const saved = {
    map: (() => { const m = store.get("saved", {}); return m && typeof m === "object" && !Array.isArray(m) ? m : {}; })(),
    has(id) { return Object.prototype.hasOwnProperty.call(this.map, id); },
    toggle(id) {
      if (this.has(id)) delete this.map[id]; else this.map[id] = Date.now();
      store.set("saved", this.map);
      return this.has(id);
    },
  };

  // Browse search, sort and filters, remembered between visits.
  // A function, so every reset gets fresh arrays (the filter lists are changed in place).
  const browseDefault = () => ({ q: "", ing: false, sort: "new", types: [], cuisines: [], time: "", savedOnly: false, review: true });
  const bstate = (() => {
    const s = store.get("browse", {});
    const o = browseDefault();
    if (s && typeof s === "object") {
      if (typeof s.q === "string") o.q = s.q;
      if (typeof s.ing === "boolean") o.ing = s.ing;
      if (typeof s.sort === "string") o.sort = s.sort;
      if (Array.isArray(s.types)) o.types = s.types.filter((x) => typeof x === "string");
      if (Array.isArray(s.cuisines)) o.cuisines = s.cuisines.filter((x) => typeof x === "string");
      if (typeof s.time === "string") o.time = s.time;
      if (typeof s.savedOnly === "boolean") o.savedOnly = s.savedOnly;
      if (typeof s.review === "boolean") o.review = s.review;
    }
    return o;
  })();
  const saveBrowse = () => store.set("browse", bstate, true);

  // Ticked ingredients and the highlighted step per recipe: { <code>: { i: [indexes], s: step or -1 } }.
  const ticks = {
    map: (() => { const m = store.get("ticks", {}); return m && typeof m === "object" && !Array.isArray(m) ? m : {}; })(),
    get(id) {
      const t = this.map[id] || {};
      return { i: Array.isArray(t.i) ? t.i.filter((x) => Number.isInteger(x)) : [], s: Number.isInteger(t.s) ? t.s : -1 };
    },
    set(id, t) {
      if (!t.i.length && t.s < 0) delete this.map[id]; else this.map[id] = { i: t.i, s: t.s };
      store.set("ticks", this.map);
    },
  };
  // Ingredients / Steps tab per recipe on phones. Kept in sessionStorage like the scroll position,
  // so a reload returns to the same tab and the same spot.
  const rtabs = (() => { try { return JSON.parse(sessionStorage.getItem("rb.rtabs") || "{}") || {}; } catch (_) { return {}; } })();
  const saveRtabs = () => { try { sessionStorage.setItem("rb.rtabs", JSON.stringify(rtabs)); } catch (_) {} };

  // Keep screen on. The switch is remembered; the lock itself is only held while a recipe is open
  // and the page is visible. iOS drops the lock when the app is hidden, so sync() takes it again
  // when the page comes back.
  const wake = {
    supported: !!(navigator.wakeLock && navigator.wakeLock.request),
    on: store.get("keepAwake", false) === true,
    lock: null,
    pending: false,
    wanted() { return this.on && current.name === "r" && byId.has(current.arg) && document.visibilityState === "visible"; },
    async acquire(fromUser) {
      if (!this.supported || this.lock || this.pending || !this.wanted()) return;
      this.pending = true;
      try {
        const l = await navigator.wakeLock.request("screen");
        this.pending = false;
        if (!this.wanted()) { l.release().catch(() => {}); return; } // left the recipe while waiting
        this.lock = l;
        l.addEventListener("release", () => { if (this.lock === l) this.lock = null; });
      } catch (_) {
        this.pending = false;
        if (fromUser) toast("This device could not keep the screen on");
      }
    },
    release() {
      const l = this.lock;
      this.lock = null;
      if (l) l.release().catch(() => {});
    },
    sync() { if (this.wanted()) this.acquire(false); else this.release(); },
  };

  // Shopping list, grouped by recipe: [{ id: <code>, name, items: [{ t: text, c: checked }] }].
  // The recipe name is stored too, so a group still has a title if the recipe is later removed.
  const shop = {
    groups: (() => {
      const g = store.get("list", []);
      if (!Array.isArray(g)) return [];
      return g.filter((x) => x && typeof x.id === "string" && Array.isArray(x.items))
        .map((x) => ({
          id: x.id, name: typeof x.name === "string" ? x.name : "",
          items: x.items.filter((it) => it && typeof it.t === "string" && it.t).map((it) => ({ t: it.t, c: it.c === true })),
        }))
        .filter((x) => x.items.length);
    })(),
    save() {
      this.groups = this.groups.filter((g) => g.items.length);
      store.set("list", this.groups);
    },
    open() { let n = 0; this.groups.forEach((g) => g.items.forEach((it) => { if (!it.c) n++; })); return n; },
    anyChecked() { return this.groups.some((g) => g.items.some((it) => it.c)); },
    // Adds items under the recipe's group. An item already on the list is not added again; if it
    // was ticked off it is unticked instead. Returns how many items were added or unticked.
    add(r, texts) {
      let g = this.groups.find((x) => x.id === r._id);
      if (!g) { g = { id: r._id, name: r.name, items: [] }; this.groups.unshift(g); }
      g.name = r.name;
      let n = 0;
      texts.forEach((t) => {
        const f = fold(t);
        const ex = g.items.find((it) => fold(it.t) === f);
        if (!ex) { g.items.push({ t, c: false }); n++; } else if (ex.c) { ex.c = false; n++; }
      });
      this.save();
      return n;
    },
  };
  // Ingredients of r not ticked on its recipe page (ticks for removed lines are ignored).
  const untickedCount = (r, t) => r.ingredients.length - t.i.filter((i) => i < r.ingredients.length).length;

  // Recently opened recipes, newest first, for "Continue cooking" on Home.
  let recentIds = (() => { const v = store.get("recent", []); return Array.isArray(v) ? v.filter((x) => typeof x === "string") : []; })();
  function noteRecent(id) {
    recentIds = [id].concat(recentIds.filter((x) => x !== id)).slice(0, 12);
    store.set("recent", recentIds, true);
  }

  // Per-tab scroll positions (sessionStorage, so a reload returns to the same spot).
  const scrolls = (() => { try { return JSON.parse(sessionStorage.getItem("rb.scroll") || "{}"); } catch (_) { return {}; } })();
  let scrollTimer = 0;
  function saveScroll(key) {
    scrolls[key] = Math.round(window.scrollY);
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => { try { sessionStorage.setItem("rb.scroll", JSON.stringify(scrolls)); } catch (_) {} }, 150);
  }

  /* ================= data ================= */
  let recipes = [];          // newest first
  let byId = new Map();      // Instagram code -> recipe
  let rawText = null;        // last recipes.json text, to skip re-renders when nothing changed
  let loadError = "";

  function prepare(data) {
    const seen = new Set();
    const out = [];
    (Array.isArray(data) ? data : []).forEach((r, i) => {
      if (!r || !str(r.name) || !str(r.url)) return;
      const id = igCode(r.url) || "x" + i;
      if (seen.has(id)) return;
      seen.add(id);
      out.push({
        name: str(r.name), cuisine: str(r.cuisine), type: str(r.type), time: str(r.time),
        ingredients: arr(r.ingredients), steps: arr(r.steps), url: str(r.url),
        needs_review: r.needs_review === true, added: str(r.added),
        _i: i, _id: id, _min: parseMinutes(r.time),
      });
    });
    // Newest first by "added"; the file itself is newest first, so file order breaks ties.
    out.sort((a, b) => b.added.localeCompare(a.added) || a._i - b._i);
    out.forEach((r, i) => {
      r._ord = i;
      r._ingF = r.ingredients.map(fold);
      r._headF = fold(r.name + "\n" + r.cuisine + "\n" + r.type);
      r._hay = r._headF + "\n" + r._ingF.join("\n");
    });
    return out;
  }

  /* ================= search ================= */
  const searchTerms = (q) => [...new Set(fold(q).split(/\s+/).filter(Boolean))];

  // Normal search: every word must appear in the name, cuisine, type or ingredients.
  // Ingredient-only: every word must appear in at least one ingredient.
  function matchSearch(r, terms, ingOnly) {
    if (!terms.length) return true;
    if (ingOnly) return terms.every((t) => r._ingF.some((x) => x.includes(t)));
    return terms.every((t) => r._hay.includes(t));
  }

  // Returns a function that escapes text and wraps every accent-insensitive match in <mark>.
  // Matching runs on the folded text; a map from folded positions back to the original
  // text keeps the marks on the right characters (e.g. "Creme" with an accent).
  function highlighter(terms) {
    if (!terms.length) return esc;
    return (text) => {
      const s = String(text == null ? "" : text);
      let f = "";
      const st = [], en = []; // per folded code unit: start / end index in the original text
      let i = 0;
      for (const ch of s) {
        const fc = fold(ch);
        for (let j = 0; j < fc.length; j++) { st.push(i); en.push(i + ch.length); }
        f += fc;
        i += ch.length;
      }
      const ranges = [];
      terms.forEach((t) => {
        for (let p = f.indexOf(t); p !== -1; p = f.indexOf(t, p + t.length)) ranges.push([st[p], en[p + t.length - 1]]);
      });
      if (!ranges.length) return esc(s);
      ranges.sort((a, b) => a[0] - b[0]);
      const merged = [];
      ranges.forEach((rg) => {
        const last = merged[merged.length - 1];
        if (last && rg[0] <= last[1]) last[1] = Math.max(last[1], rg[1]);
        else merged.push(rg.slice());
      });
      let out = "", pos = 0;
      merged.forEach(([a, b]) => { out += esc(s.slice(pos, a)) + "<mark>" + esc(s.slice(a, b)) + "</mark>"; pos = b; });
      return out + esc(s.slice(pos));
    };
  }

  // Line under the card name listing the ingredients that matched, for words not already in the name,
  // cuisine or type. With Ingredients only on, it lists matches for every word.
  function matchLine(r, terms, ingOnly, hl) {
    if (!terms.length) return "";
    const need = ingOnly ? terms : terms.filter((t) => !r._headF.includes(t));
    if (!need.length) return "";
    const hits = r.ingredients.filter((_, i) => need.some((t) => r._ingF[i].includes(t)));
    if (!hits.length) return "";
    return '<div class="card-match">' + hits.slice(0, 2).map((x) => hl(x.replace(/^~\s*/, ""))).join(", ") +
      (hits.length > 2 ? ", ..." : "") + "</div>";
  }

  /* ================= sort ================= */
  const collator = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });
  const NO_TIME = Number.MAX_SAFE_INTEGER; // recipes without a usable time go last when sorting by time
  const SORTS = [
    ["new", "Newest", (a, b) => a._ord - b._ord],
    ["old", "Oldest", (a, b) => b._ord - a._ord],
    ["az", "A-Z", (a, b) => collator.compare(a.name, b.name) || a._ord - b._ord],
    ["quick", "Quickest", (a, b) => ((a._min == null ? NO_TIME : a._min) - (b._min == null ? NO_TIME : b._min)) || a._ord - b._ord],
    ["fewest", "Fewest ingredients", (a, b) => (a.ingredients.length - b.ingredients.length) || a._ord - b._ord],
  ];
  const sortDef = (key) => SORTS.find((s) => s[0] === key) || SORTS[0];
  const sortList = (list, key) => list.slice().sort(sortDef(key)[2]);

  /* ================= filters ================= */
  // Time ranges. Recipes whose time could not be read only show up under "Any".
  const TIMES = [
    ["15", "\u2264 15 min", (m) => m != null && m <= 15],
    ["30", "\u2264 30 min", (m) => m != null && m <= 30],
    ["60", "\u2264 1 h", (m) => m != null && m <= 60],
    ["long", "Longer", (m) => m != null && m > 60],
  ];
  const timeDef = (key) => TIMES.find((t) => t[0] === key) || null;
  const FIELD = { type: "types", cuisine: "cuisines" }; // filter group -> bstate list

  // Within a group values are OR-ed (Main or Soup); groups are AND-ed.
  // skip: one group to ignore, so a group's chip counts show what tapping that chip would give.
  function matchFilters(r, skip) {
    if (skip !== "type" && bstate.types.length && !bstate.types.includes(r.type)) return false;
    if (skip !== "cuisine" && bstate.cuisines.length && !bstate.cuisines.includes(r.cuisine)) return false;
    if (skip !== "time" && bstate.time) { const t = timeDef(bstate.time); if (t && !t[2](r._min)) return false; }
    if (skip !== "saved" && bstate.savedOnly && !saved.has(r._id)) return false;
    if (skip !== "review" && !bstate.review && r.needs_review) return false;
    return true;
  }

  // Recipes matching the search and every filter group except `skip`.
  function pool(skip) {
    const terms = searchTerms(bstate.q);
    return recipes.filter((r) => matchSearch(r, terms, bstate.ing) && matchFilters(r, skip));
  }

  // Values for a type / cuisine group as [value, count]. Every value in the data is listed (most
  // common first) so chips do not jump around; selected values that are no longer in the data stay
  // listed so they can be removed.
  function facet(g) {
    const all = new Map();
    recipes.forEach((r) => { if (r[g]) all.set(r[g], (all.get(r[g]) || 0) + 1); });
    bstate[FIELD[g]].forEach((v) => { if (!all.has(v)) all.set(v, 0); });
    const cnt = new Map();
    pool(g).forEach((r) => { if (r[g]) cnt.set(r[g], (cnt.get(r[g]) || 0) + 1); });
    return [...all.entries()].sort((a, b) => b[1] - a[1] || collator.compare(a[0], b[0])).map(([v]) => [v, cnt.get(v) || 0]);
  }

  // Active filters as pills: [label, group, value].
  function activeFilters() {
    const out = [];
    bstate.types.forEach((v) => out.push([v, "type", v]));
    bstate.cuisines.forEach((v) => out.push([v, "cuisine", v]));
    const t = timeDef(bstate.time);
    if (t) out.push([t[1], "time", ""]);
    if (bstate.savedOnly) out.push(["Saved only", "saved", ""]);
    if (!bstate.review) out.push(["Hiding needs review", "review", ""]);
    return out;
  }

  function clearFilters() {
    const d = browseDefault();
    Object.assign(bstate, { types: d.types, cuisines: d.cuisines, time: d.time, savedOnly: d.savedOnly, review: d.review });
  }

  // Returns true when the data changed (or the first load failed) and the view must re-render.
  async function load() {
    try {
      const res = await fetch("recipes.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (text === rawText) return false;
      const data = JSON.parse(text);
      rawText = text;
      loadError = "";
      recipes = prepare(data);
      byId = new Map(recipes.map((r) => [r._id, r]));
      return true;
    } catch (e) {
      if (rawText != null) return false; // keep showing what we have
      loadError = (e && e.message) || String(e);
      return true;
    }
  }

  /* ================= toast ================= */
  let toastTimer = 0;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ================= sheet (bottom sheet on phones, dialog on wide screens) ================= */
  // opts: { title, body: () => html, foot: () => html, onClose }. body/foot are functions so the
  // sheet can redraw itself in place (renderSheet) while it stays open.
  let sheet = null;
  // Makes the page behind an open sheet unreachable for taps, keyboard focus and screen readers.
  function setInert(on) {
    ["#app", ".tabbar"].forEach((s) => {
      const el = $(s);
      if (!el) return;
      el.inert = on;
      if (on) el.setAttribute("aria-hidden", "true"); else el.removeAttribute("aria-hidden");
    });
  }
  function openSheet(opts) {
    closeSheet(true);
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = '<div class="sheet-backdrop" data-act="closeSheet"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">' +
        '<div class="sheet-grip" aria-hidden="true"></div>' +
        '<div class="sheet-head"><h2 id="sheetTitle">' + esc(opts.title) + "</h2>" +
          '<button class="icon-btn" type="button" data-act="closeSheet" aria-label="Close">' + icon("x") + "</button></div>" +
        '<div class="sheet-body"></div><div class="sheet-foot"></div>' +
      "</div>";
    document.body.appendChild(wrap);
    sheet = { el: wrap, opts, prevFocus: document.activeElement };
    renderSheet();
    document.documentElement.classList.add("modal-open");
    setInert(true);
    void wrap.offsetWidth; // start the open transition from the closed position
    wrap.classList.add("open");
    $(".sheet", wrap).focus({ preventScroll: true });
  }
  function renderSheet() {
    if (!sheet) return;
    const body = $(".sheet-body", sheet.el), foot = $(".sheet-foot", sheet.el);
    const top = body.scrollTop;
    body.innerHTML = sheet.opts.body();
    const f = sheet.opts.foot ? sheet.opts.foot() : "";
    foot.innerHTML = f;
    foot.hidden = !f;
    body.scrollTop = top;
  }
  function closeSheet(instant) {
    if (!sheet) return;
    const s = sheet;
    sheet = null;
    setInert(false);
    document.documentElement.classList.remove("modal-open");
    if (s.opts.onClose) s.opts.onClose();
    if (instant) s.el.remove();
    else {
      s.el.style.pointerEvents = "none";
      s.el.classList.remove("open");
      setTimeout(() => s.el.remove(), 320);
    }
    if (s.prevFocus && document.contains(s.prevFocus)) s.prevFocus.focus({ preventScroll: true });
  }

  // On/off switch row. The checkbox id is used by the change handler.
  const switchRow = (id, label, checked, note) =>
    '<label class="switch-row"><span>' + label + (note ? " <small>" + note + "</small>" : "") + "</span>" +
    '<span class="switch"><input type="checkbox" role="switch" id="' + id + '"' + (checked ? " checked" : "") + '>' +
    '<span class="track"></span></span></label>';

  /* ================= views ================= */
  function head(title, sub, right) {
    return '<header class="page-head"><div class="titles"><h1>' + esc(title) + "</h1>" +
      (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>" + (right || "") + "</header>";
  }

  /* ----- cards ----- */
  function cover(r, cls) {
    const [c1, c2, ic] = typeStyle(r.type);
    return '<div class="cover' + (cls ? " " + cls : "") + '" style="--c1:' + c1 + ";--c2:" + c2 + '">' +
      icon(ic, "cover-ic", 1.5) +
      (r._min != null ? '<span class="badge-time">' + icon("clock") + esc(fmtMinutes(r._min)) + "</span>" : "") +
      (r.cuisine ? '<span class="cover-cuisine">' + esc(r.cuisine) + "</span>" : "") + "</div>";
  }

  function heartBtn(r, cls) {
    const on = saved.has(r._id);
    return '<button class="heart' + (cls ? " " + cls : "") + '" type="button" data-act="save" data-id="' + esc(r._id) +
      '" aria-pressed="' + on + '" aria-label="Save ' + esc(r.name) + '">' + icon("heart") + "</button>";
  }

  // opts.hl(text): escaped HTML with search matches marked (defaults to esc).
  // opts.match(r): optional extra line, e.g. the ingredients that matched the search.
  function card(r, opts) {
    const hl = (opts && opts.hl) || esc;
    const meta = [r.cuisine, r.type].filter(Boolean).map(hl).join(" \u00b7 ");
    return '<article class="card"><a class="card-link" href="#/r/' + encodeURIComponent(r._id) + '">' + cover(r) +
      '<div class="card-body"><h3 class="card-name">' + hl(r.name) + "</h3>" +
      '<div class="card-meta">' + meta + (r.needs_review ? '<span class="tag-review">Review</span>' : "") + "</div>" +
      (opts && opts.match ? opts.match(r) : "") + "</div></a>" + heartBtn(r) + "</article>";
  }

  const grid = (list, opts) => '<div class="grid">' + list.map((r) => card(r, opts)).join("") + "</div>";

  const EMPTY_SITE = '<div class="state"><b>Nothing here yet</b>Share an Instagram recipe from your phone ' +
    "and it will show up here in a minute or two.</div>";

  /* ----- home ----- */
  const settingsBtn = '<button class="icon-btn" type="button" data-act="openSettings" aria-haspopup="dialog" aria-label="Settings">' + icon("gear") + "</button>";

  function rowSection(title, list, more) {
    if (!list.length) return "";
    return '<section class="h-sec"><div class="h-sec-head"><h2>' + esc(title) + "</h2>" + (more || "") + "</div>" +
      '<div class="row">' + list.map((r) => card(r)).join("") + "</div></section>";
  }

  function viewHome() {
    if (!recipes.length) return head("Recipes", "", settingsBtn) + EMPTY_SITE;
    const cont = recentIds.map((id) => byId.get(id)).filter(Boolean).slice(0, 10);
    const quick = recipes.filter((r) => r._min != null && r._min <= 30);
    const types = new Map();
    recipes.forEach((r) => { if (r.type) types.set(r.type, (types.get(r.type) || 0) + 1); });
    const tiles = [...types.entries()].sort((a, b) => b[1] - a[1] || collator.compare(a[0], b[0])).map(([t, n]) => {
      const [c1, c2, ic] = typeStyle(t);
      return '<button class="tile" type="button" data-act="typeTile" data-v="' + esc(t) + '" style="--c1:' + c1 + ";--c2:" + c2 + '">' +
        icon(ic, "", 1.6) + "<span><b>" + esc(t) + "</b><small>" + esc(plural(n, "recipe")) + "</small></span></button>";
    }).join("");
    return head("Recipes", esc(plural(recipes.length, "recipe")), settingsBtn) +
      rowSection("Recently added", recipes.slice(0, 10), recipes.length > 10 ? '<button class="link-btn" type="button" data-act="seeNewest">See all</button>' : "") +
      rowSection("Continue cooking", cont) +
      rowSection("Quick, 30 min or less", quick.slice(0, 10), quick.length > 10 ? '<button class="link-btn" type="button" data-act="seeQuick">See all</button>' : "") +
      '<button class="surprise" type="button" data-act="surprise">' + icon("dice", "", 1.8) +
        "<span><b>Surprise me</b><small>Open a random recipe</small></span></button>" +
      (tiles ? '<section class="h-sec"><div class="h-sec-head"><h2>Browse by type</h2></div><div class="tiles">' + tiles + "</div></section>" : "");
  }

  /* ----- browse ----- */
  function browseResults() {
    const terms = searchTerms(bstate.q);
    const shown = sortList(recipes.filter((r) => matchSearch(r, terms, bstate.ing) && matchFilters(r)), bstate.sort);
    const total = recipes.length;
    const count = shown.length === total ? plural(total, "recipe") : shown.length + " of " + plural(total, "recipe");
    if (!shown.length) {
      const html = '<div class="state"><b>No matches</b>' +
        (bstate.ing && terms.length > 1 ? "With Ingredients only on, every word has to be in the ingredients. " : "") +
        (activeFilters().length ? "Try another word or remove a filter." : "Try another word.") +
        '<br><button class="btn ghost" type="button" data-act="clearBrowse">Clear search and filters</button></div>';
      return { html, count };
    }
    const hl = highlighter(terms);
    // With Ingredients only on, the name and meta are not searched, so they are not highlighted either.
    const opts = { hl: bstate.ing ? esc : hl, match: (r) => matchLine(r, terms, bstate.ing, hl) };
    return { html: grid(shown, opts), count };
  }

  function filterBtnInner() {
    const n = activeFilters().length;
    return icon("sliders") + (n ? '<span class="nbadge">' + n + "</span>" : "");
  }

  function pillsHtml() {
    const act = activeFilters();
    return act.map(([label, g, v]) => '<button class="pill" type="button" data-act="rmFilter" data-g="' + g + '" data-v="' + esc(v) +
      '" aria-label="Remove filter ' + esc(label) + '">' + esc(label) + icon("x") + "</button>").join("") +
      (act.length > 1 ? '<button class="pill plain" type="button" data-act="fClear">Clear all</button>' : "");
  }

  // Updates the results, count, filter badge and pills in place, so the search box keeps focus
  // and the keyboard stays up.
  function updateResults() {
    const el = $("#results");
    if (!el) return;
    const res = browseResults();
    el.innerHTML = res.html;
    $("#bcount").textContent = res.count;
    $("#qclear").hidden = !bstate.q;
    const n = activeFilters().length;
    const fb = $("#fbtn");
    fb.innerHTML = filterBtnInner();
    fb.classList.toggle("on", n > 0);
    fb.setAttribute("aria-label", n ? "Filters, " + n + " on" : "Filters");
    const pills = $("#pills");
    pills.innerHTML = pillsHtml();
    pills.hidden = !n;
  }

  function viewBrowse() {
    if (!recipes.length) return head("Browse") + EMPTY_SITE;
    const res = browseResults();
    const s = sortDef(bstate.sort);
    const n = activeFilters().length;
    return head("Browse", '<span id="bcount">' + esc(res.count) + "</span>") +
      '<div class="browse-bar" id="bbar">' +
        '<div class="search-row">' +
          '<label class="search">' + icon("browse") +
            '<input id="q" type="search" value="' + esc(bstate.q) + '" placeholder="Search recipes or ingredients" ' +
            'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search">' +
            '<button class="clear" id="qclear" type="button" data-act="clearSearch" aria-label="Clear search"' +
            (bstate.q ? "" : " hidden") + ">" + icon("x") + "</button>" +
          "</label>" +
          '<button class="icon-btn filter-btn' + (n ? " on" : "") + '" id="fbtn" type="button" data-act="openFilters" aria-haspopup="dialog" ' +
            'aria-label="' + (n ? "Filters, " + n + " on" : "Filters") + '">' + filterBtnInner() + "</button>" +
        "</div>" +
        '<div class="toolbar">' +
          '<button class="chip" type="button" data-act="ingOnly" aria-pressed="' + bstate.ing + '">Ingredients only</button>' +
          '<span class="grow"></span>' +
          '<label class="chip select">' + icon("sort") + '<span id="sortLabel">' + esc(s[1]) + "</span>" + icon("chevDown") +
            '<select id="sort" aria-label="Sort">' +
            SORTS.map(([k, label]) => '<option value="' + k + '"' + (k === s[0] ? " selected" : "") + ">" + esc(label) + "</option>").join("") +
            "</select></label>" +
        "</div>" +
        '<div class="pills" id="pills"' + (n ? "" : " hidden") + ">" + pillsHtml() + "</div>" +
      "</div>" +
      '<div id="results">' + res.html + "</div>";
  }

  /* ----- filter sheet ----- */
  function filterSheetBody() {
    const chipGroup = (g, title) => {
      const list = facet(g);
      if (!list.length) return "";
      const sel = bstate[FIELD[g]];
      return '<section class="fgroup"><h3>' + title + '</h3><div class="chip-wrap">' + list.map(([v, c]) => {
        const on = sel.includes(v);
        return '<button class="chip" type="button" data-act="fChip" data-g="' + g + '" data-v="' + esc(v) + '" aria-pressed="' + on + '"' +
          (!on && !c ? " disabled" : "") + ">" + esc(v) + " <small>" + c + "</small></button>";
      }).join("") + "</div></section>";
    };
    const tpool = pool("time");
    const timeChips = [["", "Any", tpool.length]].concat(TIMES.map(([k, label, fn]) => [k, label, tpool.filter((r) => fn(r._min)).length]))
      .map(([k, label, c]) => {
        const on = bstate.time === k;
        return '<button class="chip" type="button" data-act="fChip" data-g="time" data-v="' + k + '" aria-pressed="' + on + '"' +
          (!on && !c ? " disabled" : "") + ">" + esc(label) + " <small>" + c + "</small></button>";
      }).join("");
    const savedCount = pool("saved").filter((r) => saved.has(r._id)).length;
    const reviewCount = recipes.filter((r) => r.needs_review).length;
    return chipGroup("type", "Type") + chipGroup("cuisine", "Cuisine") +
      '<section class="fgroup"><h3>Time</h3><div class="chip-wrap">' + timeChips + "</div></section>" +
      '<section class="fgroup">' +
        switchRow("fSaved", "Saved only", bstate.savedOnly, String(savedCount)) +
        (reviewCount ? switchRow("fReview", "Show recipes that need review", bstate.review, String(reviewCount)) : "") +
      "</section>";
  }

  function filterSheetFoot() {
    const n = pool().length;
    return '<button class="btn ghost" type="button" data-act="fClear"' + (activeFilters().length ? "" : " disabled") + ">Clear all</button>" +
      '<button class="btn" type="button" data-act="closeSheet">' + (n ? "Show " + plural(n, "recipe") : "No matches") + "</button>";
  }

  // After any filter change: remember it, update Browse behind the sheet and redraw the sheet.
  function afterFilter() {
    saveBrowse();
    updateResults();
    renderSheet();
  }

  /* ----- saved ----- */
  function viewSaved() {
    // Most recently saved first. Saved codes whose recipe is no longer in recipes.json are skipped.
    const list = recipes.filter((r) => saved.has(r._id)).sort((a, b) => (saved.map[b._id] || 0) - (saved.map[a._id] || 0));
    if (!list.length) return head("Saved") + '<div class="state"><b>No saved recipes yet</b>Tap the heart on any recipe to keep it here.</div>';
    return head("Saved", esc(plural(list.length, "recipe"))) + grid(list);
  }

  /* ----- shopping list ----- */
  function viewList() {
    if (!shop.groups.length) {
      return head("Shopping list") + '<div class="state"><b>Your list is empty</b>Open a recipe and tap Add all to list.</div>';
    }
    const n = shop.open();
    const groups = shop.groups.map((g, gi) => {
      const name = esc(g.name || "Recipe");
      const title = byId.has(g.id) ? '<a class="gname" href="#/r/' + encodeURIComponent(g.id) + '">' + name + "</a>" : '<span class="gname">' + name + "</span>";
      return '<section class="lgroup"><div class="lgroup-head">' + title +
        '<button class="icon-btn" type="button" data-act="rmGroup" data-g="' + gi + '" aria-label="Remove ' + name + ' from the list">' + icon("x") + "</button></div>" +
        '<ul class="ings">' + g.items.map((it, ii) =>
          '<li><button class="ing' + (it.c ? " on" : "") + '" type="button" role="checkbox" aria-checked="' + it.c + '" data-act="tickList" data-g="' + gi +
          '" data-i="' + ii + '"><span class="box" aria-hidden="true"></span><span class="txt">' + fmtItem(it.t) + "</span></button></li>").join("") +
        "</ul></section>";
    }).join("");
    return head("Shopping list", esc(n ? plural(n, "item") + " to buy" : "All done")) +
      '<div class="list-actions">' +
        '<button class="btn ghost" type="button" data-act="shareList">' + icon("share") + "Copy / Share</button>" +
        '<button class="btn ghost" type="button" data-act="clearChecked"' + (shop.anyChecked() ? "" : " disabled") + ">Clear checked</button>" +
      "</div>" + groups;
  }

  /* ----- settings (backup) ----- */
  function settingsBody() {
    return '<section class="fgroup"><h3>Backup</h3><div class="set-btns">' +
      '<button class="btn ghost" type="button" data-act="exportData">Export</button>' +
      '<label class="btn ghost">Import<input class="sr" type="file" id="importFile" accept="application/json,.json"></label>' +
      "</div></section>";
  }

  // Everything under the "rb." prefix: saved recipes, ticks, shopping list, recent, preferences.
  function exportData() {
    const data = {};
    store.keys().forEach((k) => { data[k] = store.get(k, null); });
    const day = new Date().toISOString().slice(0, 10);
    const name = "recipes-backup-" + day + ".json";
    const payload = JSON.stringify({ app: "recipes", version: 1, exported: new Date().toISOString(), data }, null, 2);
    let file = null;
    try { file = new File([payload], name, { type: "application/json" }); } catch (_) {}
    // On phones the share sheet offers "Save to Files"; a plain download is unreliable from the Home Screen app.
    const touch = matchMedia("(pointer: coarse)").matches;
    if (file && touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(() => {});
      return;
    }
    const url = URL.createObjectURL(file || new Blob([payload], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Backup saved");
  }

  // Replaces this device's saved data with the backup, then reloads so every view starts clean.
  async function importData(file) {
    let obj = null;
    try { obj = JSON.parse(await file.text()); } catch (_) {}
    if (!obj || obj.app !== "recipes" || !obj.data || typeof obj.data !== "object" || Array.isArray(obj.data)) {
      toast("That file is not a recipes backup");
      return;
    }
    if (!confirm("Replace the saved recipes, ticks and shopping list on this device with this backup?")) return;
    store.keys().forEach((k) => store.remove(k));
    Object.keys(obj.data).forEach((k) => { if (/^[A-Za-z]+$/.test(k)) store.set(k, obj.data[k], true); });
    askPersist();
    location.reload();
  }

  /* ----- recipe page ----- */
  // Estimated amount at the start of an item: "~300 g", "~1/2 cup", "~4".
  const EST = /^~\s*([\d.,\/\u00bc-\u00be\u2150-\u215e-]+(?:\s*(?:kg|g|mg|ml|cl|dl|l|tbsp|tsp|cups?|tablespoons?|teaspoons?|oz|lbs?)\b)?)?/i;

  // Escapes an ingredient or step, greys out "~" estimates and highlights "TBD:" gaps.
  function fmtItem(s) {
    let h = esc(s);
    h = h.replace(/(TBD:[^,;.]*)/g, '<mark class="tbd">$1</mark>');
    h = h.replace(EST, (m, q) => '<span class="est" title="Estimated amount">~' + (q || "") + "</span>");
    return h;
  }

  function viewRecipe(id) {
    const r = byId.get(id);
    const bar = '<div class="backbar"><button class="back" type="button" data-act="back">' + icon("back") + "Back</button></div>";
    if (!r) {
      return bar + '<div class="state"><b>Recipe not found</b>It may have been removed or its link changed.' +
        '<br><a class="btn" href="#/">Go to Home</a></div>';
    }
    const t = ticks.get(id);
    const tab = rtabs[id] || "ing";
    const nI = r.ingredients.length, nS = r.steps.length;
    const facts = [
      r.time ? [r.time, "Total time"] : null,
      [String(nI), nI === 1 ? "Ingredient" : "Ingredients"],
      [String(nS), nS === 1 ? "Step" : "Steps"],
    ].filter(Boolean);
    const ings = r.ingredients.map((s, i) => {
      const on = t.i.includes(i);
      return '<li><button class="ing' + (on ? " on" : "") + '" type="button" role="checkbox" aria-checked="' + on +
        '" data-act="tickIng" data-i="' + i + '"><span class="box" aria-hidden="true"></span><span class="txt">' + fmtItem(s) + "</span></button></li>";
    }).join("");
    const steps = r.steps.map((s, i) => {
      const on = t.s === i;
      return '<li><button class="step' + (on ? " on" : "") + '" type="button" aria-pressed="' + on + '" data-act="tickStep" data-i="' + i +
        '"><span class="num" aria-hidden="true">' + (i + 1) + '</span><span class="txt"><span class="sr">Step ' + (i + 1) + ": </span>" +
        fmtItem(s) + "</span></button></li>";
    }).join("");
    const igOk = /^https:\/\//i.test(r.url);
    return bar + '<article class="recipe">' + cover(r, "hero") +
      '<h1 class="r-title">' + esc(r.name) + "</h1>" +
      '<div class="sub">' + esc([r.cuisine, r.type].filter(Boolean).join(" \u00b7 ")) +
        (r.needs_review ? '<span class="tag-review">Review</span>' : "") + "</div>" +
      '<div class="facts">' + facts.map(([v, l]) => '<div class="fact"><b>' + esc(v) + "</b><span>" + l + "</span></div>").join("") + "</div>" +
      '<div class="r-actions">' +
        '<button class="act-btn" type="button" data-act="save" data-id="' + esc(r._id) + '" aria-pressed="' + saved.has(r._id) + '">' +
          icon("heart") + '<span class="when-off">Save</span><span class="when-on">Saved</span></button>' +
        '<button class="act-btn" type="button" data-act="share">' + icon("share") + "Share</button>" +
        (igOk ? '<a class="act-btn" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + icon("insta") + "Instagram</a>" : "") +
        (wake.supported ? '<label class="wake"><span>Keep screen on</span><span class="switch">' +
          '<input type="checkbox" role="switch" id="wakeSw"' + (wake.on ? " checked" : "") + '><span class="track"></span></span></label>' : "") +
      "</div>" +
      (r.needs_review ? '<div class="note-review">This recipe needs review: some amounts or steps may be missing. Gaps are marked TBD.</div>' : "") +
      '<div class="seg" role="tablist" aria-label="Recipe sections">' +
        '<button type="button" role="tab" data-act="rtab" data-t="ing" aria-selected="' + (tab === "ing") + '">Ingredients <small>' + nI + "</small></button>" +
        '<button type="button" role="tab" data-act="rtab" data-t="steps" aria-selected="' + (tab === "steps") + '">Steps <small>' + nS + "</small></button>" +
      "</div>" +
      '<div class="r-cols" data-tab="' + tab + '">' +
        '<section class="p-ing"><div class="panel-head"><h2>Ingredients</h2>' +
          '<button class="link-btn" id="resetTicks" type="button" data-act="resetTicks"' + (t.i.length ? "" : " hidden") + ">Untick all</button></div>" +
          '<ul class="ings">' + ings + "</ul>" +
          '<div class="add-row"><button class="btn ghost" type="button" data-act="addList" data-m="all">' + icon("plus") + "Add all to list</button>" +
          '<button class="btn ghost" id="addUnticked" type="button" data-act="addList" data-m="unticked"' +
            (untickedCount(r, t) > 0 && untickedCount(r, t) < nI ? "" : " hidden") + ">" + icon("plus") +
            'Add unticked (<span id="untickedN">' + untickedCount(r, t) + "</span>)</button></div></section>" +
        '<section class="p-steps"><div class="panel-head"><h2>Steps</h2></div><ol class="steps">' + steps + "</ol></section>" +
      "</div>" +
      (r.added ? '<p class="added">Added ' + esc(r.added) + "</p>" : "") +
      "</article>";
  }

  const VIEWS = { "": viewHome, browse: viewBrowse, saved: viewSaved, list: viewList, r: viewRecipe };
  const TABS = [["", "Home", "home"], ["browse", "Browse", "browse"], ["saved", "Saved", "heart"], ["list", "List", "list"]];

  function renderTabs() {
    const active = current.name === "r" ? null : current.name;
    const open = shop.open(); // items still to buy, shown as a badge on the List tab
    $("#tabs").innerHTML = TABS.map(([name, label, ic]) =>
      '<a class="tab" href="#/' + name + '"' + (active === name ? ' aria-current="page"' : "") + ">" +
      icon(ic) + "<span>" + label + "</span>" +
      (name === "list" && open ? '<span class="count"><span class="sr">, </span>' + open + '<span class="sr"> to buy</span></span>' : "") +
      "</a>").join("");
  }

  function titleFor() {
    if (current.name === "r") { const r = byId.get(current.arg); return r ? r.name + " \u00b7 Recipes" : "Recipes"; }
    const t = TABS.find(([n]) => n === current.name);
    return t && t[0] ? t[1] + " \u00b7 Recipes" : "Recipes";
  }

  function render() {
    renderTabs();
    const app = $("#app");
    if (rawText == null && !loadError) {
      app.innerHTML = '<div class="state"><div class="spinner"></div>Loading recipes...</div>';
      return;
    }
    if (loadError) {
      app.innerHTML = '<div class="state"><b>Could not load recipes</b>' + esc(loadError) +
        '<br><button class="btn" type="button" data-act="reload">Try again</button></div>';
      return;
    }
    app.innerHTML = VIEWS[current.name](current.arg);
    document.title = titleFor();
  }

  // Re-render the current view without moving the page. An open sheet is redrawn too, so its
  // counts match the new data.
  function refresh() {
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    renderSheet();
  }

  /* ================= routing ================= */
  // #/  #/browse  #/saved  #/list  #/r/<code>
  let current = { name: "", arg: "", key: "" };
  let routed = false; // false until the first route(), so a reload does not overwrite the saved scroll

  // Each history entry made inside the app gets an index. The entry the visitor landed on is 0,
  // so in-app Back only calls history.back() when there is an app page behind us.
  let histIdx = 0;
  function stampHistory(isNew) {
    const s = history.state;
    if (s && typeof s.idx === "number") { histIdx = s.idx; return; }
    histIdx = isNew ? histIdx + 1 : 0;
    history.replaceState({ idx: histIdx }, "");
  }

  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    const name = parts[0] || "";
    const arg = safeDecode(parts.slice(1).join("/"));
    return { name, arg, key: name + (arg ? "/" + arg : "") };
  }

  function go(hash, replace) {
    if (replace) { history.replaceState({ idx: histIdx }, "", hash); route(); }
    else location.hash = hash;
  }

  function route() {
    closeSheet(true); // e.g. the browser Back button while a sheet is open
    if (routed) saveScroll(current.key);
    routed = true;
    const r = parseHash();
    if (!(r.name in VIEWS)) {
      // Links from the old site were #/<code>.
      if (byId.has(r.name)) return go("#/r/" + encodeURIComponent(r.name), true);
      if (rawText != null) return go("#/", true);
    }
    current = r.name in VIEWS ? r : { name: "", arg: "", key: "" };
    if (current.name === "r" && byId.has(current.arg)) noteRecent(current.arg);
    render();
    window.scrollTo(0, scrolls[current.key] || 0);
    wake.sync(); // takes the screen lock on a recipe page, releases it everywhere else
  }

  // Shows or hides "Add unticked (n)" on the recipe page after a tick changes.
  function syncUnticked() {
    const r = byId.get(current.arg), b = $("#addUnticked");
    if (!r || !b) return;
    const n = untickedCount(r, ticks.get(r._id));
    b.hidden = !(n > 0 && n < r.ingredients.length);
    $("#untickedN").textContent = String(n);
  }

  // Opens Browse with a fresh search and filters, e.g. from a Home tile or "See all".
  function browseWith(patch) {
    clearTimeout(qTimer);
    Object.assign(bstate, browseDefault(), patch);
    saveBrowse();
    scrolls.browse = 0;
    go("#/browse");
  }

  // Shopping list as plain text, only the items still to buy.
  function listText() {
    return shop.groups.map((g) => {
      const items = g.items.filter((it) => !it.c);
      return items.length ? (g.name || "Recipe") + "\n" + items.map((it) => "- " + it.t).join("\n") : "";
    }).filter(Boolean).join("\n\n");
  }

  /* ================= actions (event delegation via data-act) ================= */
  const ACTIONS = {
    back() {
      if (histIdx > 0) history.back();
      else go("#/", true);
    },
    async reload() {
      loadError = "";
      render();
      await load();
      route();
    },
    // Heart on a card or on the recipe page. Updates every heart for that recipe in place.
    save(el) {
      const id = el.dataset.id;
      const on = saved.toggle(id);
      document.querySelectorAll('[data-act="save"]').forEach((b) => {
        if (b.dataset.id !== id) return;
        b.setAttribute("aria-pressed", String(on));
        b.classList.remove("pop");
        if (on) { void b.offsetWidth; b.classList.add("pop"); }
      });
      // Lists that depend on saved state are redrawn so the card disappears straight away.
      if (current.name === "saved") refresh();
      else if (current.name === "browse" && bstate.savedOnly) updateResults();
      toast(on ? "Saved" : "Removed from Saved");
    },
    ingOnly(el) {
      bstate.ing = !bstate.ing;
      el.setAttribute("aria-pressed", String(bstate.ing));
      saveBrowse();
      updateResults();
    },
    clearSearch() {
      clearTimeout(qTimer);
      bstate.q = "";
      saveBrowse();
      const q = $("#q");
      if (q) { q.value = ""; q.focus(); }
      updateResults();
    },
    // Keeps the chosen sort; clears the search, Ingredients only and every filter.
    clearBrowse() {
      clearTimeout(qTimer);
      Object.assign(bstate, browseDefault(), { sort: bstate.sort });
      saveBrowse();
      refresh();
    },
    openFilters() {
      openSheet({ title: "Filters", body: filterSheetBody, foot: filterSheetFoot });
    },
    closeSheet() { closeSheet(); },
    fChip(el) {
      const g = el.dataset.g, v = el.dataset.v;
      if (g === "time") bstate.time = bstate.time === v ? "" : v;
      else {
        const list = bstate[FIELD[g]];
        const i = list.indexOf(v);
        if (i >= 0) list.splice(i, 1); else list.push(v);
      }
      afterFilter();
    },
    rmFilter(el) {
      const g = el.dataset.g, v = el.dataset.v;
      if (FIELD[g]) bstate[FIELD[g]] = bstate[FIELD[g]].filter((x) => x !== v);
      else if (g === "time") bstate.time = "";
      else if (g === "saved") bstate.savedOnly = false;
      else if (g === "review") bstate.review = true;
      afterFilter();
    },
    fClear() {
      clearFilters();
      afterFilter();
    },
    // Recipe page. These update the page in place so the scroll position does not move.
    tickIng(el) {
      const id = current.arg, i = +el.dataset.i;
      const t = ticks.get(id);
      const k = t.i.indexOf(i);
      if (k >= 0) t.i.splice(k, 1); else t.i.push(i);
      ticks.set(id, t);
      el.classList.toggle("on", k < 0);
      el.setAttribute("aria-checked", String(k < 0));
      const rb = $("#resetTicks");
      if (rb) rb.hidden = !t.i.length;
      syncUnticked();
    },
    tickStep(el) {
      const id = current.arg, i = +el.dataset.i;
      const t = ticks.get(id);
      t.s = t.s === i ? -1 : i;
      ticks.set(id, t);
      document.querySelectorAll(".step").forEach((b) => {
        const on = +b.dataset.i === t.s;
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", String(on));
      });
    },
    resetTicks() {
      const id = current.arg;
      const t = ticks.get(id);
      t.i = [];
      ticks.set(id, t);
      document.querySelectorAll(".ing.on").forEach((b) => { b.classList.remove("on"); b.setAttribute("aria-checked", "false"); });
      const rb = $("#resetTicks");
      if (rb) rb.hidden = true;
      syncUnticked();
    },
    rtab(el) {
      const t = el.dataset.t === "steps" ? "steps" : "ing";
      rtabs[current.arg] = t;
      saveRtabs();
      const cols = $(".r-cols");
      if (cols) cols.dataset.tab = t;
      document.querySelectorAll('.seg [role="tab"]').forEach((b) => b.setAttribute("aria-selected", String(b.dataset.t === t)));
    },
    // Native share sheet where available (iOS), otherwise copy the recipe link.
    async share() {
      const r = byId.get(current.arg);
      if (!r) return;
      const url = location.href;
      if (navigator.share) {
        try { await navigator.share({ title: r.name, url }); } catch (_) { /* cancelled */ }
        return;
      }
      try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch (_) { toast("Could not copy the link"); }
    },
    // Shopping list.
    addList(el) {
      const r = byId.get(current.arg);
      if (!r) return;
      const t = ticks.get(r._id);
      const texts = el.dataset.m === "unticked" ? r.ingredients.filter((_, i) => !t.i.includes(i)) : r.ingredients;
      const n = shop.add(r, texts);
      renderTabs();
      toast(n ? "Added " + plural(n, "item") + " to the list" : "Already on the list");
    },
    tickList(el) {
      const g = shop.groups[+el.dataset.g];
      const it = g && g.items[+el.dataset.i];
      if (!it) return;
      it.c = !it.c;
      shop.save();
      refresh();
    },
    rmGroup(el) {
      const g = shop.groups[+el.dataset.g];
      if (!g) return;
      shop.groups.splice(+el.dataset.g, 1);
      shop.save();
      refresh();
      toast("Removed " + (g.name || "recipe") + " from the list");
    },
    clearChecked() {
      shop.groups.forEach((g) => { g.items = g.items.filter((it) => !it.c); });
      shop.save();
      refresh();
    },
    // Share sheet on phones (Notes, Messages, Reminders...), clipboard elsewhere.
    async shareList() {
      const text = listText();
      if (!text) { toast("Nothing left to buy"); return; }
      if (navigator.share && matchMedia("(pointer: coarse)").matches) {
        try { await navigator.share({ title: "Shopping list", text }); } catch (_) { /* cancelled */ }
        return;
      }
      try { await navigator.clipboard.writeText(text); toast("List copied"); } catch (_) { toast("Could not copy the list"); }
    },
    // Home.
    typeTile(el) { browseWith({ types: [el.dataset.v] }); },
    seeNewest() { browseWith({ sort: "new" }); },
    seeQuick() { browseWith({ sort: "quick", time: "30" }); },
    surprise() {
      if (!recipes.length) return;
      const pick = recipes.length > 1 ? recipes.filter((r) => r._id !== recentIds[0]) : recipes;
      go("#/r/" + encodeURIComponent(pick[Math.floor(Math.random() * pick.length)]._id));
    },
    // Settings.
    openSettings() { openSheet({ title: "Settings", body: settingsBody }); },
    exportData() { exportData(); },
  };

  // Search box: short debounce, then update the results only.
  let qTimer = 0;
  document.addEventListener("input", (e) => {
    if (e.target.id !== "q") return;
    const v = e.target.value;
    $("#qclear").hidden = !v;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { bstate.q = v.trim(); saveBrowse(); updateResults(); }, 120);
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.id === "q" && e.key === "Enter") e.target.blur(); // hides the iOS keyboard
    if (e.key === "Escape" && sheet) closeSheet();
  });
  document.addEventListener("change", (e) => {
    const id = e.target.id;
    if (id === "sort") {
      bstate.sort = sortDef(e.target.value)[0];
      $("#sortLabel").textContent = sortDef(bstate.sort)[1];
      saveBrowse();
      updateResults();
    } else if (id === "fSaved") {
      bstate.savedOnly = e.target.checked;
      afterFilter();
    } else if (id === "fReview") {
      bstate.review = e.target.checked;
      afterFilter();
    } else if (id === "wakeSw") {
      wake.on = e.target.checked;
      store.set("keepAwake", wake.on, true);
      if (wake.on) wake.acquire(true); else wake.release();
    } else if (id === "importFile") {
      const f = e.target.files && e.target.files[0];
      e.target.value = ""; // so choosing the same file again still fires change
      if (f) importData(f);
    }
  });

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  window.addEventListener("hashchange", () => { stampHistory(true); route(); });
  window.addEventListener("scroll", () => {
    if (routed) saveScroll(current.key);
    // Thin line under the sticky search bar once the page scrolls beneath it.
    const bar = $("#bbar");
    if (bar) bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= parseFloat(getComputedStyle(bar).top) + 0.5 && window.scrollY > 0);
  }, { passive: true });

  // Coming back to the app: fetch quietly and only re-render if recipes.json changed.
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible") return;
    wake.sync();
    if (await load()) refresh();
  });

  /* ================= start ================= */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  stampHistory(false);
  if (store.keys().length) askPersist();
  current = parseHash();
  render();
  load().then(route);
})();
</script>
</body>
</html>
